<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dns resolver Michigan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root{
            --bg:#0b0712;--bg2:#160f24;--bg3:#1f142e;--bg4:#130c1f;--text:#e6dbff;--text2:#bfa6ff;--text3:#9980b3;--text4:#d4c7e8;--border:#321f4d;--border2:#442a66;--border3:#281840;--btn:#251a3a;--btn2:#402666;--btn3:#2d1a4a;--accent:#d4a8ff;--accent2:#e0c4ff;--accent-btn:#782ec7;--accent-btn2:#8c3be0;--green:#1a6b3c;--green2:#2ecc71;--input:#1f142e;--input-text:#e6e1ff;--placeholder:#665980;--dev-bg:#1a1130;--dev-border:#3d2760;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bg.jpg');--overlay:rgba(11,7,18,0.6);--preset-bg:#1a5c3a;--preset-text:#c2ffcc;--preset-hover:#22734a;--shadow:rgba(212,168,255,0.3);--clear-hover:#c0392b;--toggle-active-text:#fff;--hover-text:#fff;--active-border:#9445ff;--settings-active-bg:#402666;--tooltip-bg:#251a3a;--tooltip-text:#bfa6ff;--progress-bg:#251a3a;--progress-fill:#782ec7;--logo:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png')
        }
        .light{
            --bg:#fefefe;--bg2:#f5f5f5;--bg3:#eee;--bg4:#f5f5f5;--text:#333;--text2:#555;--text3:#939394;--text4:#444;--border:#ddd;--border2:#ccc;--border3:#ddd;--btn:#f0f0f0;--btn2:#e8e8e8;--btn3:#eee;--accent:#666;--accent2:#777;--accent-btn:#888;--accent-btn2:#999;--green:#1a6b3c;--green2:#2ecc71;--input:#f5f5f5;--input-text:#333;--placeholder:#aaa;--dev-bg:#f0f0f0;--dev-border:#ddd;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgw.jpg');--overlay:rgba(254,254,254,0.7);--preset-bg:#1a6b3c;--preset-text:#fff;--preset-hover:#1e7a45;--shadow:rgba(0,0,0,0.1);--clear-hover:#c0392b;--toggle-active-text:#333;--hover-text:#333;--active-border:#aaa;--settings-active-bg:#d5d5d5;--tooltip-bg:#e8e8e8;--tooltip-text:#555;--progress-bg:#e0e0e0;--progress-fill:#888;--logo:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logow.png')
        }
        *{transition:all 0.2s ease}
        body{background-color:var(--bg);background-image:var(--bg-img);background-size:cover;background-position:center;background-attachment:scroll;color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box;position:relative}
        body::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background-color:var(--overlay);z-index:0}
        .container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
        .header{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:3px;flex-wrap:wrap;gap:6px}
        .header-left{display:flex;align-items:center;gap:8px}
        .logo{height:50px;cursor:pointer;user-select:none}
        .logo:hover{filter:drop-shadow(0 0 8px var(--shadow))}
        .social-links{display:flex;gap:4px}
        .social-link{background-color:var(--btn2);color:var(--text2);border:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;text-decoration:none}
        .social-link:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .social-link svg{width:16px;height:16px;fill:currentColor}
        .header-buttons{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
        .h-btn{background-color:var(--btn2);color:var(--text2);border:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
        .h-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .h-btn.active{background-color:var(--settings-active-bg)}
        .h-btn.lang{background-color:var(--btn3)}
        .h-btn.preset{background-color:var(--preset-bg);color:var(--preset-text)}
        .h-btn.preset:hover{background-color:var(--preset-hover);color:#fff}
        .settings-box{background-color:var(--bg2);border-radius:8px;padding:14px;display:none;flex-direction:column;gap:10px;border:1px solid var(--border)}
        .s-label{font-size:14px;color:var(--text3);display:flex;align-items:center;gap:4px}
        .tip-btn{background:var(--tooltip-bg);color:var(--tooltip-text);border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;font-weight:bold;padding:0;line-height:18px;text-align:center}
        .tip-btn:hover{transform:scale(1.1);background:var(--accent-btn);color:#fff}
        .tip-content{display:none;font-size:11px;color:var(--text3);margin-top:2px;padding:4px 6px;background:var(--tooltip-bg);border-radius:4px}
        .tip-content.show{display:block}
        .btn-group{display:flex;gap:6px;flex-wrap:wrap}
        .tgl-btn{flex:1;min-width:60px;background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:10px 8px;font-size:13px;border-radius:6px;cursor:pointer;text-align:center}
        .tgl-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .tgl-btn.active{background-color:var(--accent-btn);color:var(--toggle-active-text);border-color:var(--active-border);box-shadow:0 0 8px var(--shadow)}
        .dns-select-btn{background:var(--accent-btn);color:#fff;border:none;padding:10px;border-radius:6px;cursor:pointer;font-size:14px;width:100%;text-align:center}
        .dns-select-btn:hover{background:var(--accent-btn2)}
        textarea{width:100%;height:160px;background-color:var(--input);color:var(--input-text);border:1px solid var(--border2);border-radius:8px;padding:10px;font-size:15px;box-sizing:border-box;resize:vertical;outline:none}
        textarea::placeholder{color:var(--placeholder)}
        textarea:focus{border-color:var(--accent-btn);box-shadow:0 0 10px var(--shadow)}
        .input-row,.results-row{display:flex;gap:4px;align-items:stretch}
        .side-btns{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
        .side-btn{background-color:var(--btn2);color:var(--text2);border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;flex:1;display:flex;align-items:center;justify-content:center}
        .side-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .side-btn.danger:hover{background-color:var(--clear-hover);color:#fff}
        .main-btn{color:#fff;border:none;border-radius:8px;padding:14px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 0 15px var(--shadow)}
        .main-btn.start{background-color:var(--accent-btn);width:100%}.main-btn.start:hover{background-color:var(--accent-btn2)}
        .main-btn.stop{background-color:#c0392b;display:none}.main-btn.stop:hover{background-color:#e74c3c}
        .main-btn:disabled{opacity:0.5;cursor:not-allowed}
        .progress-bar{display:none;height:6px;background:var(--progress-bg);border-radius:3px;overflow:hidden}
        .progress-fill{height:100%;background:var(--progress-fill);border-radius:3px;width:0%}
        .dns-indicator,.stats,.time-info{color:var(--text3);font-size:12px;text-align:center;min-height:14px}
        .stats{font-size:13px}
        .line-counter{color:var(--text3);font-size:11px;text-align:right;min-height:12px}
        .results-container{display:none;flex-direction:column;gap:6px;margin-top:2px}
        .results-header{display:flex;justify-content:flex-start;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:2px}
        .results-actions{display:flex;gap:4px;flex-wrap:wrap}
        .a-btn{background-color:var(--btn3);color:var(--text2);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px}
        .a-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .results-textarea{width:100%;height:160px;background-color:var(--bg4);border:1px solid var(--border3);color:var(--text4);border-radius:8px;padding:10px;font-size:15px;box-sizing:border-box;resize:vertical;outline:none;font-family:monospace}
        .results-textarea:focus{border-color:var(--accent-btn);box-shadow:0 0 10px var(--shadow)}
        .fullscreen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:997;background:var(--bg);padding:40px 20px;box-sizing:border-box;display:none;flex-direction:column;gap:10px}
        .fullscreen-overlay.show{display:flex}
        .fullscreen-overlay textarea{height:100%;background:var(--bg4);color:var(--text4);border:1px solid var(--border3);border-radius:8px;padding:15px;font-size:16px;font-family:monospace;resize:none}
        .fullscreen-close{position:absolute;top:10px;right:20px;background:var(--accent-btn);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:16px}
        .fullscreen-close:hover{background:var(--accent-btn2)}
        .quick-actions{display:flex;gap:4px;flex-wrap:wrap}
        .q-btn{background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px}
        .q-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        select{background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:8px;border-radius:6px;font-size:13px;cursor:pointer}
        .easter-egg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--accent-btn);color:#fff;padding:20px 40px;border-radius:16px;font-size:24px;font-weight:bold;z-index:999;text-align:center;box-shadow:0 0 40px var(--shadow);pointer-events:none;transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
        .easter-egg.show{transform:translate(-50%,-50%) scale(1)}
        .easter-egg .heart{display:inline-block;animation:pulse 0.6s ease-in-out infinite alternate}
        @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.3)}}
        input[type="file"]{display:none}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:998;justify-content:center;align-items:center}
        .modal-overlay.show{display:flex}
        .modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;color:var(--text2);font-size:14px;max-width:400px;width:90%;display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow-y:auto}
        .modal-box button{background:var(--btn);color:var(--text2);border:1px solid var(--border);padding:10px;border-radius:6px;cursor:pointer;font-size:14px;width:100%}
        .modal-box button:hover{background:var(--accent-btn);color:#fff}
        .dns-grid{display:flex;flex-direction:column;gap:8px;text-align:left}
        .dns-grid label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--text2);padding:8px;border-radius:6px;background:var(--btn)}
        .dns-grid label:hover{background:var(--btn2)}
        .dns-grid input[type="checkbox"]{accent-color:var(--accent-btn);width:18px;height:18px}
        .dns-done-btn{background:var(--accent-btn)!important;color:#fff!important;margin-top:6px}
        .drop-box{background:var(--bg2);border:2px dashed var(--accent-btn);border-radius:16px;padding:40px;text-align:center;color:var(--text2);font-size:16px;cursor:pointer}
        .drop-box.drag-over{border-color:var(--accent);background:var(--btn2)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent-btn);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.3);opacity:0;pointer-events:none}
        .toast.show{animation:toastIn 0.3s forwards,toastOut 0.3s 1.7s forwards}
        @keyframes toastIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
        @keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
    </style>
</head>
<body>
<div class="easter-egg" id="easterEgg"><span id="easterText"></span> <span class="heart">❤️</span></div>
<div class="modal-overlay" id="dropOverlay" onclick="hideModal('dropOverlay')"><div class="drop-box" id="dropBox" onclick="event.stopPropagation()"><span id="dropText"></span><input type="file" id="dropFileInput" accept="*" onchange="handleFile(this,true)" style="display:none"></div></div>
<div class="modal-overlay" id="exportMenu" onclick="hideModal('exportMenu')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-weight:bold" id="exportTitle"></div><button onclick="exportFile('txt')">📄 TXT</button><button onclick="exportFile('csv')">📊 CSV</button><button onclick="exportFile('json')">📋 JSON</button></div></div>
<div class="modal-overlay" id="dnsMenu" onclick="hideModal('dnsMenu')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-weight:bold" id="dnsMenuTitle"></div><div class="dns-grid" id="dnsGrid"></div><button class="dns-done-btn" onclick="hideModal('dnsMenu')" id="dnsDoneBtn"></button></div></div>
<div class="fullscreen-overlay" id="fsInput"><button class="fullscreen-close" onclick="closeFS('fsInput')">✕</button><textarea id="fsInputBox"></textarea></div>
<div class="fullscreen-overlay" id="fsResults"><button class="fullscreen-close" onclick="closeFS('fsResults')">✕</button><textarea id="fsResultsBox" readonly></textarea></div>
<div class="container" id="mainContainer">
    <div class="header">
        <div class="header-left">
            <img class="logo" id="logo" src="https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png" alt="Dns resolver Michigan" onclick="easterClick()">
            <div class="social-links">
                <a href="https://t.me/MichiMochirellune" target="_blank" class="social-link" title="Telegram"><svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.441-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.015 3.333-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.145.118.185.276.204.388.02.111.022.354.012.444z"/></svg></a>
                <a href="https://github.com/Michi-Mochirellune" target="_blank" class="social-link" title="GitHub"><svg viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg></a>
            </div>
        </div>
        <div class="header-buttons">
            <button class="h-btn preset" onclick="addPreset('telegram.org\nreddit.com\nwikipedia.org\nstackoverflow.com\n')" id="presetBtn"></button>
            <button class="h-btn" id="themeToggleBtn" onclick="cycleTheme()"></button>
            <button class="h-btn lang" id="langToggleBtn" onclick="toggleLanguage()"></button>
            <button class="h-btn" id="settingsToggleBtn" onclick="toggleSettings()"><span id="settingsBtnText"></span></button>
        </div>
    </div>
    <div class="settings-box" id="settingsBox">
        <div class="s-label" id="dnsLabel"></div>
        <button class="dns-select-btn" onclick="showDNSMenu()" id="dnsSelectBtn"></button>
        <div class="s-label" id="showDNSNamesLabel"><button class="tip-btn" onclick="toggleTip('dnsNamesTip')">?</button></div>
        <div class="tip-content" id="dnsNamesTip"><span id="dnsNamesTipText"></span></div>
        <div class="btn-group">
            <button class="tgl-btn" id="dnsNamesOn" onclick="setShowDNSNames(true)"><span id="dnsNamesOnText"></span></button>
            <button class="tgl-btn active" id="dnsNamesOff" onclick="setShowDNSNames(false)"><span id="dnsNamesOffText"></span></button>
        </div>
        <div class="s-label" id="typeLabel"></div>
        <div class="btn-group">
            <select id="recordType" onchange="setRecordType(this.value)">
                <option value="A">🌐 A (IPv4)</option>
                <option value="AAAA">🌍 AAAA (IPv6)</option>
                <option value="MX">📧 MX (<span id="mxLabel"></span>)</option>
                <option value="NS">🗄️ NS (<span id="nsLabel"></span>)</option>
                <option value="SOA">📋 SOA (<span id="soaLabel"></span>)</option>
                <option value="TXT">📝 TXT (<span id="txtLabel"></span>)</option>
            </select>
        </div>
        <div class="s-label" id="showTTLLabel"><button class="tip-btn" onclick="toggleTip('ttlTip')">?</button></div>
        <div class="tip-content" id="ttlTip"><span id="ttlTipText"></span></div>
        <div class="btn-group">
            <button class="tgl-btn" id="ttlOn" onclick="setShowTTL(true)"><span id="ttlOnText"></span></button>
            <button class="tgl-btn active" id="ttlOff" onclick="setShowTTL(false)"><span id="ttlOffText"></span></button>
        </div>
        <div class="s-label" id="timeoutLabel"><button class="tip-btn" onclick="toggleTip('timeoutTip')">?</button></div>
        <div class="tip-content" id="timeoutTip"><span id="timeoutTipText"></span></div>
        <div class="btn-group">
            <button class="tgl-btn active" id="to5" onclick="setTimeoutVal(5)"><span id="to5Text"></span></button>
            <button class="tgl-btn" id="to10" onclick="setTimeoutVal(10)"><span id="to10Text"></span></button>
            <button class="tgl-btn" id="to15" onclick="setTimeoutVal(15)"><span id="to15Text"></span></button>
        </div>
        <div class="s-label" id="delayLabel"><button class="tip-btn" onclick="toggleTip('delayTip')">?</button></div>
        <div class="tip-content" id="delayTip"><span id="delayTipText"></span></div>
        <div class="btn-group">
            <button class="tgl-btn active" id="del0" onclick="setDelay(0)"><span id="del0Text"></span></button>
            <button class="tgl-btn" id="del500" onclick="setDelay(500)"><span id="del500Text"></span></button>
            <button class="tgl-btn" id="del1000" onclick="setDelay(1000)"><span id="del1000Text"></span></button>
        </div>
        <div class="s-label" id="formatLabel"><button class="tip-btn" onclick="toggleTip('formatTip')">?</button></div>
        <div class="tip-content" id="formatTip"><span id="formatTipText"></span></div>
        <div class="btn-group"><button class="tgl-btn" id="formatBtn" onclick="toggleFormat()">🔢 Формат: Only IP</button></div>
    </div>
    <div class="quick-actions">
        <button class="q-btn" onclick="dedupDomains()" id="dedupBtn"></button>
        <button class="q-btn" onclick="showModal('dropOverlay')" id="uploadBtn"></button>
    </div>
    <input type="file" id="fileInput" accept="*" onchange="handleFile(this,false)">
    <div class="input-row">
        <textarea id="inputDomains" placeholder="..." oninput="updateLineCounter()"></textarea>
        <div class="side-btns">
            <button class="side-btn" onclick="openFS('fsInput','inputDomains','fsInputBox')" title="Раскрыть">⛶</button>
            <button class="side-btn" onclick="copyTextarea('inputDomains')" title="Копировать">📋</button>
            <button class="side-btn danger" onclick="clearInputOnly()" title="Очистить">🗑️</button>
        </div>
    </div>
    <div class="line-counter" id="lineCounter"></div>
    <button class="main-btn start" id="startBtn" onclick="startResolving()"></button>
    <button class="main-btn stop" id="stopBtn" onclick="stopResolving()"></button>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="dns-indicator" id="dnsIndicator"></div>
    <div class="stats" id="stats"></div>
    <div class="time-info" id="timeInfo"></div>
    <div class="results-container" id="resultsContainer">
        <div class="results-header">
            <div class="results-actions">
                <button class="a-btn" onclick="cycleFilter()" id="filterBtn"></button>
                <button class="a-btn" onclick="showModal('exportMenu')" id="exportMenuBtn"></button>
            </div>
        </div>
        <div class="results-row">
            <textarea id="resultsBox" class="results-textarea" readonly placeholder="..."></textarea>
            <div class="side-btns">
                <button class="side-btn" onclick="openFS('fsResults','resultsBox','fsResultsBox')" title="Раскрыть">⛶</button>
                <button class="side-btn" onclick="copyTextarea('resultsBox')" title="Копировать">📋</button>
                <button class="side-btn danger" onclick="clearResultsOnly()" title="Очистить">🗑️</button>
            </div>
        </div>
    </div>
</div>
<script>
let outputFormat='onlyip',currentLanguage='ru',recordType='A',timeout=5000,delay=0,themeMode='system',easterClicks=0,filterMode='all',currentResults=[],abortController=null,resolveStartTime=0,showTTL=false,showDNSNames=false,activeServers=['cloudflare'];
const allDNSServers={cloudflare:{name:'☁️ Cloudflare',short:'CF',url:'https://cloudflare-dns.com/dns-query'},google:{name:'🔴 Google',short:'G',url:'https://dns.google/resolve'},dnssb:{name:'🟢 DNS.SB',short:'SB',url:'https://doh.dns.sb/dns-query'}};
const timeoutIds={5:'to5',10:'to10',15:'to15'};
const delayIds={0:'del0',500:'del500',1000:'del1000'};
const recordTypes={A:1,AAAA:28,MX:15,NS:2,SOA:6,TXT:16};
const L={ru:{settings:'⚙️',closeSettings:'❌',dnsLabel:'🌐 Выбор DNS серверов',dnsSelectBtn:'📡 Выбрать DNS серверы',showDNSNamesLabel:'🏷️ Показывать названия DNS',dnsNamesTipText:'Добавляет краткое название DNS перед IP-адресом',dnsNamesOn:'✅ Вкл',dnsNamesOff:'❌ Выкл',dnsMenuTitle:'📡 Выберите DNS серверы',dnsDoneBtn:'✅ Готово',typeLabel:'📝 Тип записи',showTTLLabel:'⏱️ Показывать TTL',ttlTipText:'Время жизни DNS-записи в секундах',ttlOn:'✅ Вкл',ttlOff:'❌ Выкл',timeoutLabel:'⏰ Таймаут',delayLabel:'🐌 Задержка',formatLabel:'🎨 Формат вывода',formatBtn:['📁 Формат: Hosts','🔢 Формат: Only IP'],formatTipText:'Hosts — для hosts-файла (IP домен), Only IP — только адреса',inputPlaceholder:'📝 Вставь список доменов сюда...',startBtnA:'🚀 Узнать IP адреса',startBtnAAAA:'🚀 Узнать IPv6 адреса',startBtnMX:'📧 Узнать почтовые серверы',startBtnNS:'🗄️ Узнать DNS-серверы',startBtnSOA:'📋 Узнать зоны',startBtnTXT:'📝 Узнать TXT-записи',stopBtn:'⏹️ Стоп',resultsPlaceholder:'📊 Результаты появятся здесь...',resolving:'⏳ Идет проверка...\n',empty:'📭 Список пуст',error:'❌ Ошибка/Не найден',errorHosts:'# ❌ Ошибка',presetBtn:'📋 Тест сайтов',dedupBtn:'♻️ Убрать дубли',uploadBtn:'📂 Импорт',filterBtn:['🔍 Все','✅ Успешные','❌ Ошибки'],exportTitle:'📥 Экспорт',exportBtn:'📥 Экспорт',dnsIndicator:p=>`🔍 Проверено через: ${p}`,easter:'Спасибо за использование',mxLabel:'Почта',nsLabel:'DNS-серверы',soaLabel:'Зона',txtLabel:'Текст',to5:'5 сек',to10:'10 сек',to15:'15 сек',del0:'⚡ Без задержки',del500:'0.5 сек',del1000:'1 сек',timeoutTipText:'Максимальное время ожидания ответа от DNS-сервера',delayTipText:'Пауза между запросами, чтобы не перегружать сервер',dropText:'📂 Перетащите файл сюда или нажмите, чтобы выбрать',timeInfo:(s,z)=>`⏱️ Время: ${s} сек | 📦 Ответ: ${z} KB`,stats:(f,e,t)=>`✅ Найдено: ${f} / ❌ Ошибок: ${e} / 📊 Всего: ${t}`,copied:'✅ Скопировано',copyFail:'❌ Не удалось',emptyToast:'📭 Нечего копировать',imported:'✅ Файл загружен',importFail:'❌ Ошибка загрузки',cleared:'🗑️ Очищено',started:'🚀 Проверка началась',exported:'📥 Экспорт сохранён',dupsRemoved:'♻️ Дубли удалены',presetAdded:'📋 Тестовые сайты добавлены'},en:{settings:'⚙️',closeSettings:'❌',dnsLabel:'🌐 Select DNS servers',dnsSelectBtn:'📡 Choose DNS servers',showDNSNamesLabel:'🏷️ Show DNS names',dnsNamesTipText:'Adds short DNS name before IP address',dnsNamesOn:'✅ On',dnsNamesOff:'❌ Off',dnsMenuTitle:'📡 Select DNS servers',dnsDoneBtn:'✅ Done',typeLabel:'📝 Record type',showTTLLabel:'⏱️ Show TTL',ttlTipText:'DNS record Time To Live in seconds',ttlOn:'✅ On',ttlOff:'❌ Off',timeoutLabel:'⏰ Timeout',delayLabel:'🐌 Delay',formatLabel:'🎨 Output format',formatBtn:['📁 Format: Hosts','🔢 Format: Only IP'],formatTipText:'Hosts — for hosts file (IP domain), Only IP — just addresses',inputPlaceholder:'📝 Paste domain list here...',startBtnA:'🚀 Resolve IP addresses',startBtnAAAA:'🚀 Resolve IPv6 addresses',startBtnMX:'📧 Resolve mail servers',startBtnNS:'🗄️ Resolve DNS servers',startBtnSOA:'📋 Resolve zones',startBtnTXT:'📝 Resolve TXT records',stopBtn:'⏹ Stop',resultsPlaceholder:'📊 Results will appear here...',resolving:'⏳ Resolving...\n',empty:'📭 List is empty',error:'❌ Error/Not found',errorHosts:'# ❌ Error',presetBtn:'📋 Test sites',dedupBtn:'♻️ Remove duplicates',uploadBtn:'📂 Import',filterBtn:['🔍 All','✅ Success','❌ Errors'],exportTitle:'📥 Export',exportBtn:'📥 Export',dnsIndicator:p=>`🔍 Resolved via: ${p}`,easter:'Thank you for using',mxLabel:'Mail',nsLabel:'DNS servers',soaLabel:'Zone',txtLabel:'Text',to5:'5 sec',to10:'10 sec',to15:'15 sec',del0:'⚡ No delay',del500:'0.5 sec',del1000:'1 sec',timeoutTipText:'Maximum wait time for DNS response',delayTipText:'Pause between requests to avoid overloading',dropText:'📂 Drop file here or click to select',timeInfo:(s,z)=>`⏱️ Time: ${s}s | 📦 Response: ${z}KB`,stats:(f,e,t)=>`✅ Found: ${f} / ❌ Errors: ${e} / 📊 Total: ${t}`,copied:'✅ Copied',copyFail:'❌ Failed',emptyToast:'📭 Nothing to copy',imported:'✅ File loaded',importFail:'❌ Load error',cleared:'🗑️ Cleared',started:'🚀 Resolving started',exported:'📥 Export saved',dupsRemoved:'♻️ Duplicates removed',presetAdded:'📋 Test sites added'}};
function t(key,...args){let str=L[currentLanguage][key];if(typeof str==='function')return str(...args);return str}
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=msg;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000)}
function updateLogo(){document.getElementById('logo').src=document.body.classList.contains('light')?'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logow.png':'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png'}
function setShowTTL(v){showTTL=v;document.getElementById('ttlOn').classList.toggle('active',v);document.getElementById('ttlOff').classList.toggle('active',!v)}
function setShowDNSNames(v){showDNSNames=v;document.getElementById('dnsNamesOn').classList.toggle('active',v);document.getElementById('dnsNamesOff').classList.toggle('active',!v)}
function copyTextarea(id){const ta=document.getElementById(id);const text=ta.value;if(!text.trim()){toast(t('emptyToast'));return}ta.select();ta.setSelectionRange(0,99999);try{document.execCommand('copy');toast(t('copied'))}catch(e){toast(t('copyFail'))}ta.blur()}
function showModal(id){document.getElementById(id).classList.add('show')}
function hideModal(id){document.getElementById(id).classList.remove('show')}
function openFS(overlayId,sourceId,targetId){document.getElementById(targetId).value=document.getElementById(sourceId).value;document.getElementById(overlayId).classList.add('show')}
function closeFS(id){document.getElementById(id).classList.remove('show')}
function showDNSMenu(){const grid=document.getElementById('dnsGrid');grid.innerHTML='';for(let key in allDNSServers){const s=allDNSServers[key];const checked=activeServers.includes(key)?'checked':'';grid.innerHTML+=`<label><input type="checkbox" value="${key}" ${checked} onchange="toggleServer('${key}',this.checked)">${s.name}</label>`}document.getElementById('dnsMenuTitle').innerText=t('dnsMenuTitle');document.getElementById('dnsDoneBtn').innerText=t('dnsDoneBtn');showModal('dnsMenu')}
function toggleServer(key,checked){if(checked){if(!activeServers.includes(key))activeServers.push(key)}else{activeServers=activeServers.filter(k=>k!==key);if(activeServers.length===0)activeServers=['cloudflare']}}
function updateAllTexts(){
document.getElementById('stopBtn').textContent=t('stopBtn');document.getElementById('easterText').innerText=t('easter');
if(currentResults.length>0){const names=activeServers.map(k=>allDNSServers[k]?allDNSServers[k].name:k).join(', ');document.getElementById('dnsIndicator').innerText=t('dnsIndicator',names);const found=currentResults.filter(r=>!r.error).length,errors=currentResults.length-found;document.getElementById('stats').innerText=t('stats',found,errors,currentResults.length);const totalSize=currentResults.reduce((s,r)=>s+(r.size||0),0);const sizeKB=(totalSize/1024).toFixed(1);const elapsed=((resolveStartTime>0?(Date.now()-resolveStartTime)/1000:0)).toFixed(1);document.getElementById('timeInfo').innerText=t('timeInfo',elapsed,sizeKB)}
document.getElementById('inputDomains').placeholder=t('inputPlaceholder');document.getElementById('resultsBox').placeholder=t('resultsPlaceholder');
document.getElementById('dnsLabel').innerText=t('dnsLabel');document.getElementById('dnsSelectBtn').innerText=t('dnsSelectBtn');
document.getElementById('showDNSNamesLabel').innerHTML=t('showDNSNamesLabel')+' <button class="tip-btn" onclick="toggleTip(\'dnsNamesTip\')">?</button>';
document.getElementById('dnsNamesTipText').innerText=t('dnsNamesTipText');document.getElementById('dnsNamesOnText').innerText=t('dnsNamesOn');document.getElementById('dnsNamesOffText').innerText=t('dnsNamesOff');
document.getElementById('typeLabel').innerText=t('typeLabel');
document.getElementById('showTTLLabel').innerHTML=t('showTTLLabel')+' <button class="tip-btn" onclick="toggleTip(\'ttlTip\')">?</button>';
document.getElementById('ttlTipText').innerText=t('ttlTipText');document.getElementById('ttlOnText').innerText=t('ttlOn');document.getElementById('ttlOffText').innerText=t('ttlOff');
document.getElementById('timeoutLabel').innerHTML=t('timeoutLabel')+' <button class="tip-btn" onclick="toggleTip(\'timeoutTip\')">?</button>';
document.getElementById('delayLabel').innerHTML=t('delayLabel')+' <button class="tip-btn" onclick="toggleTip(\'delayTip\')">?</button>';
document.getElementById('formatLabel').innerHTML=t('formatLabel')+' <button class="tip-btn" onclick="toggleTip(\'formatTip\')">?</button>';
document.getElementById('presetBtn').innerText=t('presetBtn');document.getElementById('dedupBtn').innerText=t('dedupBtn');
document.getElementById('uploadBtn').innerText=t('uploadBtn');
document.getElementById('exportMenuBtn').innerText=t('exportBtn');document.getElementById('filterBtn').innerText=t('filterBtn')[filterMode==='all'?0:filterMode==='success'?1:2];
document.getElementById('exportTitle').innerText=t('exportTitle');
document.getElementById('mxLabel').innerText=t('mxLabel');document.getElementById('nsLabel').innerText=t('nsLabel');
document.getElementById('soaLabel').innerText=t('soaLabel');document.getElementById('txtLabel').innerText=t('txtLabel');
document.getElementById('to5Text').innerText=t('to5');document.getElementById('to10Text').innerText=t('to10');document.getElementById('to15Text').innerText=t('to15');
document.getElementById('del0Text').innerText=t('del0');document.getElementById('del500Text').innerText=t('del500');document.getElementById('del1000Text').innerText=t('del1000');
document.getElementById('timeoutTipText').innerText=t('timeoutTipText');document.getElementById('delayTipText').innerText=t('delayTipText');
document.getElementById('formatTipText').innerText=t('formatTipText');document.getElementById('dropText').innerText=t('dropText');
updateStartBtnText();updateFormatButtonText();
document.getElementById('langToggleBtn').innerText=currentLanguage==='ru'?'🇷🇺 RU':'🇺🇸 EN';
updateSettingsButtonText();updateLineCounter()}
function updateStartBtnText(){document.getElementById('startBtn').innerText=t('startBtn'+recordType)}
function updateSettingsButtonText(){const stb=document.getElementById('settingsToggleBtn'),sbt=document.getElementById('settingsBtnText'),sb=document.getElementById('settingsBox');if(sb.style.display==='flex'){sbt.innerText=t('closeSettings');stb.classList.add('active')}else{sbt.innerText=t('settings');stb.classList.remove('active')}}
function updateFormatButtonText(){const b=document.getElementById('formatBtn');b.innerText=t('formatBtn')[outputFormat==='hosts'?0:1];b.classList.toggle('active',outputFormat==='hosts')}
function toggleLanguage(){currentLanguage=currentLanguage==='ru'?'en':'ru';updateAllTexts();localStorage.setItem('dnsresolver_lang',currentLanguage)}
function applyTheme(){if(themeMode==='system'){document.body.classList.toggle('light',window.matchMedia('(prefers-color-scheme: light)').matches)}else{document.body.classList.toggle('light',themeMode==='light')}updateThemeIcon();updateLogo()}
function updateThemeIcon(){const btn=document.getElementById('themeToggleBtn');btn.innerText=themeMode==='system'?'🔄':themeMode==='light'?'☀️':'🌙'}
function cycleTheme(){themeMode=themeMode==='system'?'light':themeMode==='light'?'dark':'system';applyTheme();localStorage.setItem('dnsresolver_theme',themeMode)}
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(themeMode==='system')applyTheme()});
function toggleSettings(){const b=document.getElementById('settingsBox');b.style.display=b.style.display==='flex'?'none':'flex';updateSettingsButtonText()}
function toggleTip(id){document.getElementById(id).classList.toggle('show')}
function setRecordType(t){recordType=t;updateStartBtnText();document.getElementById('inputDomains').placeholder=t('inputPlaceholder')}
function setTimeoutVal(s){timeout=s*1000;Object.values(timeoutIds).forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('active')});const ab=document.getElementById(timeoutIds[s]);if(ab)ab.classList.add('active')}
function setDelay(d){delay=d;Object.values(delayIds).forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('active')});const ab=document.getElementById(delayIds[d]);if(ab)ab.classList.add('active')}
function toggleFormat(){outputFormat=outputFormat==='hosts'?'onlyip':'hosts';updateFormatButtonText()}
function addPreset(text){document.getElementById('inputDomains').value=text;updateLineCounter();toast(t('presetAdded'))}
function dedupDomains(){const ta=document.getElementById('inputDomains');const lines=ta.value.split('\n').map(l=>l.trim().toLowerCase()).filter(l=>l.length>0);ta.value=[...new Set(lines)].join('\n');updateLineCounter();toast(t('dupsRemoved'))}
function clearInputOnly(){document.getElementById('inputDomains').value='';updateLineCounter();toast(t('cleared'))}
function clearResultsOnly(){document.getElementById('resultsBox').value='';document.getElementById('resultsContainer').style.display='none';document.getElementById('stats').innerText='';document.getElementById('timeInfo').innerText='';document.getElementById('dnsIndicator').innerText='';currentResults=[];toast(t('cleared'))}
function updateLineCounter(){const ta=document.getElementById('inputDomains');const lines=ta.value.split('\n').filter(l=>l.trim().length>0);document.getElementById('lineCounter').innerText=lines.length>0?(currentLanguage==='ru'?`📊 Строк: ${lines.length}`:`📊 Lines: ${lines.length}`):''}
function handleFile(input,isDrop){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){document.getElementById('inputDomains').value=e.target.result;updateLineCounter();if(isDrop)hideModal('dropOverlay');toast(t('imported'))};reader.onerror=function(){toast(t('importFail'))};reader.readAsText(file);input.value=''}
function cycleFilter(){filterMode=filterMode==='all'?'success':filterMode==='success'?'errors':'all';document.getElementById('filterBtn').innerText=t('filterBtn')[filterMode==='all'?0:filterMode==='success'?1:2];applyFilter()}
function applyFilter(){if(!currentResults.length)return;let filtered=[...currentResults];if(filterMode==='success')filtered=currentResults.filter(r=>!r.error);else if(filterMode==='errors')filtered=currentResults.filter(r=>r.error);displayResults(filtered)}
function displayResults(results){const rb=document.getElementById('resultsBox');let lines=[];for(let r of results){if(r.error){lines.push(outputFormat==='hosts'?`${t('errorHosts')} ${r.domain}`:'-')}else{let extras='';if(showTTL&&r.ttl)extras+=' [TTL:'+r.ttl+'s]';if(r.dnssec)extras+=' [🔒 DNSSEC]';let prefix='';if(showDNSNames&&r.server&&allDNSServers[r.server]){prefix=allDNSServers[r.server].short+': '}lines.push(outputFormat==='hosts'?`${r.ip} ${r.domain}${extras}`:prefix+r.ip+extras)}}rb.value=lines.join('\n')}
function easterClick(){easterClicks++;if(easterClicks>=3){document.getElementById('easterEgg').classList.add('show');setTimeout(()=>document.getElementById('easterEgg').classList.remove('show'),2500);easterClicks=0}}
function exportFile(format){const rb=document.getElementById('resultsBox');if(!rb.value.trim()&&!currentResults.length){toast(t('emptyToast'));return}let content=rb.value,mime='text/plain',ext='txt';if(format==='csv'&&currentResults.length){content='Domain,IP,Status';if(showTTL)content+=',TTL';content+='\n';for(let r of currentResults){content+=`${r.domain},${r.ip||''},${r.error?'Error':'OK'}`;if(showTTL)content+=`,${r.ttl||''}`;content+='\n'}mime='text/csv';ext='csv'}else if(format==='json'&&currentResults.length){content=JSON.stringify(currentResults.map(r=>({domain:r.domain,ip:r.ip||null,error:r.error,ttl:showTTL?r.ttl||null:undefined,dnssec:r.dnssec||false})),null,2);mime='application/json';ext='json'}const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`dns-results.${ext}`;a.click();URL.revokeObjectURL(url);toast(t('exported'))}
function stopResolving(){if(abortController){abortController.abort();abortController=null}document.getElementById('startBtn').style.display='inline-block';document.getElementById('stopBtn').style.display='none';document.getElementById('progressBar').style.display='none';document.getElementById('startBtn').disabled=false}
async function resolveSingle(domain,serverKey,type){try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);let apiUrl=allDNSServers[serverKey]?allDNSServers[serverKey].url:'https://cloudflare-dns.com/dns-query';let r=await fetch(`${apiUrl}?name=${encodeURIComponent(domain)}&type=${type}`,{headers:{'Accept':'application/dns-json'},signal:controller.signal});clearTimeout(timer);let d=await r.json();let result=null,ttl=null,dnssec=!!d.AD;if(d.Answer&&d.Answer.length>0){if(type==='MX'){let mx=d.Answer.filter(r=>r.type===15).sort((a,b)=>a.preference-b.preference);if(mx.length>0){result=mx.map(r=>r.data).join(', ');ttl=mx[0].TTL}}else if(type==='NS'){let ns=d.Answer.filter(r=>r.type===2);if(ns.length>0){result=ns.map(r=>r.data).join(', ');ttl=ns[0].TTL}}else if(type==='TXT'){let txt=d.Answer.filter(r=>r.type===16);if(txt.length>0){result=txt.map(r=>r.data).join(' | ');ttl=txt[0].TTL}}else if(type==='SOA'){let soa=d.Answer.find(r=>r.type===6);if(soa){result=soa.data;ttl=soa.TTL}}else{let rec=d.Answer.find(r=>r.type===recordTypes[type]);if(rec){result=rec.data;ttl=rec.TTL}}}return{result,ttl,dnssec,size:JSON.stringify(d).length}}catch(e){return null}}
async function startResolving(){
const it=document.getElementById('inputDomains').value,rb=document.getElementById('resultsBox'),rc=document.getElementById('resultsContainer'),stats=document.getElementById('stats'),timeInfo=document.getElementById('timeInfo'),dnsIndicator=document.getElementById('dnsIndicator'),startBtn=document.getElementById('startBtn'),stopBtn=document.getElementById('stopBtn'),progressBar=document.getElementById('progressBar'),progressFill=document.getElementById('progressFill');
let inputText=it.replace(/https?:\/\//g,'').replace(/\/.*/g,'');
const lines=inputText.split('\n');let domains=lines.map(l=>l.trim()).filter(l=>l.length>0);
if(domains.length===0){rc.style.display='none';rb.value=t('empty');toast(t('emptyToast'));return}
rc.style.display='flex';stats.innerText='';timeInfo.innerText='';dnsIndicator.innerText='';rb.value='';startBtn.style.display='none';stopBtn.style.display='inline-block';stopBtn.textContent=t('stopBtn');progressBar.style.display='block';progressFill.style.width='0%';stopBtn.disabled=false;currentResults=[];resolveStartTime=Date.now();
const names=activeServers.map(k=>allDNSServers[k]?allDNSServers[k].name:k).join(', ');dnsIndicator.innerText=t('dnsIndicator',names);
toast(t('started'));
let found=0,errors=0,totalSize=0;abortController=new AbortController();
let allOutput=[];
for(let i=0;i<domains.length;i++){
if(abortController.signal.aborted)break;let domain=domains[i];
let domainResults=[];
for(let s of activeServers){
    let res=await resolveSingle(domain,s,recordType);
    let shortName=allDNSServers[s]?allDNSServers[s].short:s;
    if(res&&res.result){found++;totalSize+=res.size;currentResults.push({domain,ip:res.result,error:false,ttl:res.ttl||null,dnssec:res.dnssec,size:res.size,server:s});let extras='';if(showTTL&&res.ttl)extras+=' [TTL:'+res.ttl+'s]';if(res.dnssec)extras+=' [🔒 DNSSEC]';
        if(outputFormat==='hosts'){
     if(showDNSNames){domainResults.push(`${shortName}: ${res.result} ${domain}${extras}`)}
    else{domainResults.push(`${res.result} ${domain}${extras}`)}
}
        else if(showDNSNames){domainResults.push(`${shortName}: ${res.result}${extras}`)}
        else{domainResults.push(res.result+extras)}
    }else{errors++;currentResults.push({domain,ip:null,error:true,size:0,server:s});
        if(outputFormat==='hosts'){
    if(showDNSNames){domainResults.push(`${shortName}: ${t('errorHosts')} ${domain}`)}
    else{domainResults.push(`${t('errorHosts')} ${domain}`)}
}
        else if(showDNSNames){domainResults.push(`${shortName}: -`)}
        else{domainResults.push(t('errorHosts')+' '+domain)}
    }
}
allOutput.push(domainResults.join('\n'));
rb.value=allOutput.join('\n');stats.innerText=t('stats',found,errors,i+1);progressFill.style.width=((i+1)/domains.length*100)+'%';
if(delay>0&&i<domains.length-1&&!abortController.signal.aborted)await new Promise(r=>setTimeout(r,delay))}
const elapsed=((Date.now()-resolveStartTime)/1000).toFixed(1),sizeKB=(totalSize/1024).toFixed(1);timeInfo.innerText=t('timeInfo',elapsed,sizeKB);
abortController=null;stopResolving();
if('serviceWorker' in navigator && Notification.permission === 'granted'){navigator.serviceWorker.ready.then(reg=>{reg.showNotification('DNS Resolver Michigan',{body:'Проверка завершена :Р',icon:'icon-192.png',silent:true})})}
document.getElementById('dropBox').addEventListener('click',()=>document.getElementById('dropFileInput').click());
document.getElementById('dropBox').addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')});
document.getElementById('dropBox').addEventListener('dragleave',e=>{e.currentTarget.classList.remove('drag-over')});
document.getElementById('dropBox').addEventListener('drop',e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');const file=e.dataTransfer.files[0];if(file){const dt=new DataTransfer();dt.items.add(file);document.getElementById('dropFileInput').files=dt.files;handleFile(document.getElementById('dropFileInput'),true)}});
try{const savedLang=localStorage.getItem('dnsresolver_lang');if(savedLang==='ru'||savedLang==='en')currentLanguage=savedLang;const savedTheme=localStorage.getItem('dnsresolver_theme');if(savedTheme==='system'||savedTheme==='light'||savedTheme==='dark')themeMode=savedTheme}catch(e){}
applyTheme();updateAllTexts();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
if('Notification' in window && Notification.permission === 'default'){Notification.requestPermission()}
</script>
</body>
</html>
