<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dns resolver by Michigan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /* Твой оригинальный стиль полностью сохранён */
        body {
            background-color: #0b0712;
            color: #e6dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 5px;
        }

        h1 {
            color: #ba8cff;
            font-size: 22px;
            margin: 0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(186, 140, 255, 0.3);
        }

        .settings-toggle {
            background-color: #402666;
            color: #e6ccff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .settings-toggle:hover {
            background-color: #59358c;
        }

        .settings-box {
            background-color: #160f24;
            border-radius: 8px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #321f4d;
        }

        .settings-label {
            font-size: 14px;
            color: #9980b3;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            background-color: #251a3a;
            color: #bfa6ff;
            border: 1px solid #4d3380;
            padding: 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background-color: #782ec7;
            color: #ffffff;
            border-color: #9445ff;
            box-shadow: 0 0 8px rgba(120, 46, 199, 0.5);
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: #1f142e;
            color: #e6e1ff;
            border: 1px solid #442a66;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #9e52ff;
        }

        .start-btn {
            background-color: #782ec7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(120, 46, 199, 0.3);
        }

        .start-btn:hover {
            background-color: #8c3be0;
        }

        .results-textarea {
            width: 100%;
            height: 180px;
            background-color: #130c1f;
            border: 1px solid #281840;
            color: #d4c7e8;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            font-family: monospace;
            display: none;
        }

        .copy-hint {
            color: #9980b3;
            font-size: 14px;
            text-align: center;
            margin-top: 5px;
            display: none;
        }

        .credits {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dns resolver by Michigan</h1>
        <button class="settings-toggle" id="settingsToggleBtn" onclick="toggleSettings()">⚙ Настройки</button>
    </div>

    <div class="settings-box" id="settingsBox">
        <div class="settings-label" id="dnsLabel">Выбор DNS сервера:</div>
        <div class="btn-group">
            <button class="toggle-btn active" id="dnsCloudflare" onclick="setDns('cloudflare')">Cloudflare</button>
            <button class="toggle-btn" id="dnsGoogle" onclick="setDns('google')">Google</button>
        </div>

        <div class="btn-group">
            <button class="toggle-btn" id="formatBtn" onclick="cycleFormat()">Формат: Classic</button>
            <button class="toggle-btn" id="fontBtn" onclick="cycleFont()">Шрифт: Обычный</button>
        </div>

        <div class="btn-group">
            <button class="toggle-btn active" id="langBtn" onclick="toggleLang()">Language: RU</button>
        </div>
    </div>

    <textarea id="inputDomains" placeholder="Вставь список доменов сюда..."></textarea>

    <button class="start-btn" id="startBtn" onclick="startResolving()">Узнать IP адреса</button>

    <textarea id="resultsBox" class="results-textarea" readonly placeholder="Результаты появятся здесь..."></textarea>
    
    <div id="copyHint" class="copy-hint">💡 Зажми палец на тексте выше, чтобы скопировать результаты</div>

    <div class="credits">
        <div class="credits-title">Ссылки разработчика</div>
        <div class="credits-links">
            <a href="https://github.com/Michi-Mochirellune" target="_blank"><i class="fab fa-github"></i> GitHub</a>
            <a href="https://t.me/MichiMochirellune" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
        </div>
    </div>
</div>

<script>
    let dnsProvider = 'cloudflare'; 
    let formatState = 0;
    const formats = ['classic', 'hosts', 'ipOnly'];
    let fontSizeState = 0;          
    let currentLang = 'ru';

    const fontSizes = ['16px', '19px', '23px'];
    
    const translations = { /* ... твой оригинальный translations полностью ... */ 
        ru: { /* оставь как было */ },
        en: { /* оставь как было */ }
    };

    // === Все твои функции (toggleSettings, setDns, cycleFormat и т.д.) оставляем без изменений ===
    // (я их не трогаю, чтобы не ломать)

    async function startResolving() {
        const inputText = document.getElementById('inputDomains').value.trim();
        const resultsBox = document.getElementById('resultsBox');
        const copyHint = document.getElementById('copyHint');
        const t = translations[currentLang];
        const currentFormat = formats[formatState];

        resultsBox.style.display = 'block';
        copyHint.style.display = 'none';
        resultsBox.value = t.checking || 'Идет проверка...\n';

        const domains = inputText.split('\n').map(line => line.trim()).filter(line => line.length > 0);

        if (domains.length === 0) {
            resultsBox.value = t.emptyList || 'Список пуст.';
            return;
        }

        let output = [];
        const apiUrl = dnsProvider === 'google' 
            ? 'https://dns.google/resolve' 
            : 'https://cloudflare-dns.com/dns-query';

        for (let domain of domains) {
            try {
                const response = await fetch(`\( {apiUrl}?name= \){encodeURIComponent(domain)}&type=A`, {
                    headers: { 
                        'Accept': 'application/dns-json'
                    },
                    mode: 'cors'
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const ip = data.Answer?.find(record => record.type === 1)?.data;

                if (ip) {
                    if (currentFormat === 'hosts') output.push(`${ip} ${domain}`);
                    else if (currentFormat === 'ipOnly') output.push(ip);
                    else output.push(`[ + ] ${domain}  →  ${ip}`);
                } else {
                    throw new Error('No A record');
                }
            } catch (e) {
                console.error(`Ошибка при запросе ${domain}:`, e);
                if (currentFormat === 'hosts') output.push(`# [${t.errorLabel || 'Ошибка'}] ${domain}`);
                else if (currentFormat === 'ipOnly') output.push(`[${t.errorLabel || 'Ошибка'}] ${domain}`);
                else output.push(`[ - ] ${domain}  →  ${t.errorStatus || '[Ошибка/Не найден]'}`);
            }
            
            resultsBox.value = output.join('\n');
        }

        if (formatState !== 0 && output.length > 0) {
            copyHint.style.display = 'block';
        }
    }

    // Инициализация
    updateLanguageUI();
</script>

</body>
</html>
