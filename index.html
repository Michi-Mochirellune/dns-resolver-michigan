<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dns resolver by Michigan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0712;
            color: #e6dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 5px;
        }

        h1 {
            color: #ba8cff;
            font-size: 22px;
            margin: 0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(186, 140, 255, 0.3);
        }

        .settings-toggle {
            background-color: #402666;
            color: #e6ccff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .settings-toggle:hover {
            background-color: #59358c;
        }

        .settings-box {
            background-color: #160f24;
            border-radius: 8px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #321f4d;
        }

        .settings-label {
            font-size: 14px;
            color: #9980b3;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            background-color: #251a3a;
            color: #bfa6ff;
            border: 1px solid #4d3380;
            padding: 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background-color: #782ec7;
            color: #ffffff;
            border-color: #9445ff;
            box-shadow: 0 0 8px rgba(120, 46, 199, 0.5);
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: #1f142e;
            color: #e6e1ff;
            border: 1px solid #442a66;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #9e52ff;
        }

        .start-btn {
            background-color: #782ec7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(120, 46, 199, 0.3);
        }

        .start-btn:hover {
            background-color: #8c3be0;
        }

        .results-textarea {
            width: 100%;
            height: 180px;
            background-color: #130c1f;
            border: 1px solid #281840;
            color: #d4c7e8;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            font-family: monospace;
            display: none;
        }

        .copy-hint {
            color: #9980b3;
            font-size: 14px;
            text-align: center;
            margin-top: 5px;
            display: none;
        }

        .credits {
            margin-top: 20px;
            text-align: center;
        }

        .credits-title {
            color: #9980b3;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .credits-links {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .credits a {
            color: #a380e6;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            transition: 0.2s;
        }

        .credits a:hover {
            color: #dfd4ff;
            text-shadow: 0 0 8px rgba(186, 140, 255, 0.6);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Dns resolver by Michigan</h1>
        <button class="settings-toggle" id="settingsToggleBtn" onclick="toggleSettings()">⚙ Настройки</button>
    </div>

    <div class="settings-box" id="settingsBox">
        <div class="settings-label" id="dnsLabel">Выбор DNS сервера:</div>
        <div class="btn-group">
            <button class="toggle-btn active" id="dnsCloudflare" onclick="setDns('cloudflare')">Cloudflare</button>
            <button class="toggle-btn" id="dnsGoogle" onclick="setDns('google')">Google</button>
        </div>

        <div class="btn-group">
            <button class="toggle-btn" id="formatBtn" onclick="cycleFormat()">Формат: Classic</button>
            <button class="toggle-btn" id="fontBtn" onclick="cycleFont()">Шрифт: Обычный</button>
        </div>

        <div class="btn-group">
            <button class="toggle-btn active" id="langBtn" onclick="toggleLang()">Language: RU</button>
        </div>
    </div>

    <textarea id="inputDomains" placeholder="Вставь список доменов сюда..."></textarea>

    <button class="start-btn" id="startBtn" onclick="startResolving()">Узнать IP адреса</button>

    <textarea id="resultsBox" class="results-textarea" readonly placeholder="Результаты появятся здесь..."></textarea>
    
    <div id="copyHint" class="copy-hint">💡 Зажми палец на тексте выше, чтобы скопировать результаты</div>

    <!-- Ссылки разработчика -->
    <div class="credits">
        <div class="credits-title">Ссылки разработчика</div>
        <div class="credits-links">
            <a href="https://github.com/Michi-Mochirellune" target="_blank">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="https://t.me/MichiMochirellune" target="_blank">
                <i class="fab fa-telegram"></i> Telegram
            </a>
        </div>
    </div>
</div>

<script>
    let dnsProvider = 'cloudflare'; 
    let formatState = 0; // 0 = classic, 1 = hosts, 2 = ipOnly
    const formats = ['classic', 'hosts', 'ipOnly'];
    
    let fontSizeState = 0;          
    let currentLang = 'ru';

    const fontSizes = ['16px', '19px', '23px'];
    
    const translations = {
        ru: {
            settingsOpen: '⚙ Настройки',
            settingsClose: '✕ Закрыть',
            dnsLabel: 'Выбор DNS сервера:',
            formatLabels: ['Формат: Classic', '[✔] Формат: Hosts', '[⚡] Формат: Only IP'],
            fontLabels: ['Обычный', 'Средний', 'Крупный'],
            placeholderInput: 'Вставь список доменов сюда...',
            placeholderResults: 'Результаты появятся здесь...',
            startBtn: 'Узнать IP адреса',
            checking: 'Идет проверка...\n',
            emptyList: 'Список пуст.',
            copyHint: '💡 Зажми палец на тексте выше, чтобы скопировать результаты',
            errorStatus: '[Ошибка/Не найден]',
            errorLabel: 'Ошибка'
        },
        en: {
            settingsOpen: '⚙ Settings',
            settingsClose: '✕ Close',
            dnsLabel: 'Select DNS Server:',
            formatLabels: ['Format: Classic', '[✔] Format: Hosts', '[⚡] Format: Only IP'],
            fontLabels: ['Normal', 'Medium', 'Large'],
            placeholderInput: 'Paste domain list here...',
            placeholderResults: 'Results will appear here...',
            startBtn: 'Resolve IPs',
            checking: 'Checking...\n',
            emptyList: 'List is empty.',
            copyHint: '💡 Long press on the text above to copy results',
            errorStatus: '[Error/Not found]',
            errorLabel: 'Error'
        }
    };

    function updateLanguageUI() {
        const t = translations[currentLang];
        const box = document.getElementById('settingsBox');
        const toggleBtn = document.getElementById('settingsToggleBtn');
        
        if (box.style.display === 'flex') {
            toggleBtn.innerText = t.settingsClose;
        } else {
            toggleBtn.innerText = t.settingsOpen;
        }

        document.getElementById('dnsLabel').innerText = t.dnsLabel;
        document.getElementById('langBtn').innerText = `Language: ${currentLang.toUpperCase()}`;
        document.getElementById('formatBtn').innerText = t.formatLabels[formatState];
        document.getElementById('fontBtn').innerText = (currentLang === 'ru' ? 'Шрифт: ' : 'Font: ') + t.fontLabels[fontSizeState];
        
        document.getElementById('inputDomains').placeholder = t.placeholderInput;
        document.getElementById('resultsBox').placeholder = t.placeholderResults;
        document.getElementById('startBtn').innerText = t.startBtn;
    }

    function toggleSettings() {
        const box = document.getElementById('settingsBox');
        const btn = document.getElementById('settingsToggleBtn');
        const t = translations[currentLang];

        if (box.style.display === 'flex') {
            box.style.display = 'none';
            btn.innerText = t.settingsOpen;
            btn.style.backgroundColor = '#402666';
        } else {
            box.style.display = 'flex';
            btn.innerText = t.settingsClose;
            btn.style.backgroundColor = '#662645';
        }
    }

    function setDns(provider) {
        dnsProvider = provider;
        document.getElementById('dnsCloudflare').classList.remove('active');
        document.getElementById('dnsGoogle').classList.remove('active');
        document.getElementById(provider === 'cloudflare' ? 'dnsCloudflare' : 'dnsGoogle').classList.add('active');
    }

    function cycleFormat() {
        formatState = (formatState + 1) % 3;
        document.getElementById('formatBtn').innerText = translations[currentLang].formatLabels[formatState];
        
        if (formatState > 0) {
            document.getElementById('formatBtn').classList.add('active');
        } else {
            document.getElementById('formatBtn').classList.remove('active');
        }
    }

    function cycleFont() {
        fontSizeState = (fontSizeState + 1) % 3;
        const newSize = fontSizes[fontSizeState];
        document.getElementById('fontBtn').innerText = 
            (currentLang === 'ru' ? 'Шрифт: ' : 'Font: ') + translations[currentLang].fontLabels[fontSizeState];
        
        document.getElementById('inputDomains').style.fontSize = newSize;
        document.getElementById('resultsBox').style.fontSize = newSize;
    }

    function toggleLang() {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        updateLanguageUI();
    }

    async function startResolving() {
        const inputText = document.getElementById('inputDomains').value.trim();
        const resultsBox = document.getElementById('resultsBox');
        const copyHint = document.getElementById('copyHint');
        const t = translations[currentLang];
        const currentFormat = formats[formatState];

        resultsBox.style.display = 'block';
        copyHint.style.display = 'none';
        resultsBox.value = t.checking;

        const lines = inputText.split('\n');
        const domains = lines.map(line => line.trim()).filter(line => line.length > 0);

        if (domains.length === 0) {
            resultsBox.value = t.emptyList;
            return;
        }

        let output = [];
        const apiUrl = dnsProvider === 'google' 
            ? 'https://dns.google/resolve' 
            : 'https://cloudflare-dns.com/dns-query';

        for (let domain of domains) {
            try {
                let response = await fetch(`\( {apiUrl}?name= \){encodeURIComponent(domain)}&type=A`, {
                    headers: { 'Accept': 'application/dns-json' }
                });
                let data = await response.json();
                
                let ip = data.Answer?.find(record => record.type === 1)?.data;

                if (ip) {
                    if (currentFormat === 'hosts') output.push(`${ip} ${domain}`);
                    else if (currentFormat === 'ipOnly') output.push(ip);
                    else output.push(`[ + ] ${domain}  →  ${ip}`);
                } else {
                    throw new Error();
                }
            } catch (e) {
                if (currentFormat === 'hosts') output.push(`# [${t.errorLabel}] ${domain}`);
                else if (currentFormat === 'ipOnly') output.push(`[${t.errorLabel}] ${domain}`);
                else output.push(`[ - ] ${domain}  →  ${t.errorStatus}`);
            }
            
            resultsBox.value = output.join('\n');
        }

        // Показываем подсказку только в Hosts и Only IP
        if (formatState !== 0 && output.length > 0) {
            copyHint.innerText = t.copyHint;
            copyHint.style.display = 'block';
        }
    }

    // Инициализация
    updateLanguageUI();
</script>

</body>
</html>
