<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dns resolver Michigan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        button, select, textarea {
            font-family: inherit; font-size: inherit; line-height: inherit;
            border: none; background: none; color: inherit;
            -webkit-appearance: none; -moz-appearance: none; appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0b0712; --bg2: #160f24; --bg3: #1f142e; --bg4: #130c1f;
            --text: #e6dbff; --text2: #bfa6ff; --text3: #9980b3; --text4: #d4c7e8;
            --border: #321f4d; --border2: #442a66; --border3: #281840;
            --btn: #251a3a; --btn2: #402666; --btn3: #2d1a4a;
            --accent: #d4a8ff; --accent2: #e0c4ff;
            --accent-btn: #782ec7; --accent-btn2: #8c3be0;
            --green: #1a6b3c; --green2: #2ecc71;
            --input: #1f142e; --input-text: #e6e1ff; --placeholder: #665980;
            --dev-bg: #1a1130; --dev-border: #3d2760;
            --bg-img: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bg.jpg');
            --overlay: rgba(11, 7, 18, 0.6);
            --preset-bg: #2c8c3c; --preset-text: #fff; --preset-hover: #1e7a45;
            --shadow: rgba(212, 168, 255, 0.3);
            --clear-hover: #c0392b;
            --toggle-active-text: #fff; --hover-text: #fff;
            --active-border: #9445ff;
            --settings-active-bg: #402666;
            --tooltip-bg: #251a3a; --tooltip-text: #bfa6ff;
            --progress-bg: #251a3a; --progress-fill: #782ec7;
            --logo-url: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png');
            --theme-icon: '🌙';
        }

        .light {
            --bg: #fefefe; --bg2: #f5f5f5; --bg3: #eee; --bg4: #f5f5f5;
            --text: #333; --text2: #555; --text3: #939394; --text4: #444;
            --border: #ddd; --border2: #ccc; --border3: #ddd;
            --btn: #f0f0f0; --btn2: #e8e8e8; --btn3: #eee;
            --accent: #666; --accent2: #777;
            --accent-btn: #888; --accent-btn2: #999;
            --green: #1a6b3c; --green2: #2ecc71;
            --input: #f5f5f5; --input-text: #333; --placeholder: #aaa;
            --dev-bg: #f0f0f0; --dev-border: #ddd;
            --bg-img: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgw.jpg');
            --overlay: rgba(254, 254, 254, 0.7);
            --preset-bg: #2c8c3c; --preset-text: #fff; --preset-hover: #1e7a45;
            --shadow: rgba(0, 0, 0, 0.1);
            --clear-hover: #c0392b;
            --toggle-active-text: #333; --hover-text: #333;
            --active-border: #aaa; --settings-active-bg: #d5d5d5;
            --tooltip-bg: #e8e8e8; --tooltip-text: #555;
            --progress-bg: #e0e0e0; --progress-fill: #888;
            --logo-url: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logow.png');
            --theme-icon: '☀️';
        }

        .xp {
            --bg: #3881f4; --bg2: #2360c4; --bg3: #1a4ab0; --bg4: #1a3a6a;
            --text: #ffffff; --text2: #ffffff; --text3: #e0e8ff; --text4: #ffffff;
            --border: #5a9af5; --border2: #4a8ae5; --border3: #3a7ad5;
            --btn: #2d6cd4; --btn2: #2360c4; --btn3: #1a4ab0;
            --accent: #6aafff; --accent2: #8ac0ff;
            --accent-btn: #4a8ae5; --accent-btn2: #3a7ad5;
            --green: #2c8c3c; --green2: #1e7a45;
            --input: #2360c4; --input-text: #ffffff; --placeholder: #a0c8ff;
            --dev-bg: #2d6cd4; --dev-border: #5a9af5;
            --bg-img: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgxp.png');
            --overlay: rgba(0, 0, 0, 0.1);
            --preset-bg: #2c8c3c; --preset-text: #ffffff; --preset-hover: #1e7a45;
            --shadow: rgba(0, 0, 0, 0.3);
            --clear-hover: #c0392b;
            --toggle-active-text: #ffffff; --hover-text: #ffffff;
            --active-border: #6aafff; --settings-active-bg: #1a4ab0;
            --tooltip-bg: #1a4ab0; --tooltip-text: #e0e8ff;
            --progress-bg: #1a4ab0; --progress-fill: #6aafff;
            --logo-url: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logoxp.png');
            --theme-icon: 'XP';
        }

        *, *::before, *::after {
            transition: background-color 0.2s ease, color 0.2s ease,
                        border-color 0.2s ease, box-shadow 0.2s ease,
                        opacity 0.2s ease;
        }

        body {
            background-color: var(--bg);
            background-image: var(--bg-img);
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--overlay);
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 3px;
            flex-wrap: wrap;
            gap: 6px;
            position: relative;
        }

        .header-left { display: flex; align-items: center; gap: 8px; }

        .logo {
            height: 50px;
            cursor: pointer;
            user-select: none;
            transition: filter 0.2s ease;
        }
        .logo:hover { filter: drop-shadow(0 0 8px var(--shadow)); }

        .header-buttons { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

        .h-btn {
            background-color: var(--btn2);
            color: var(--text2);
            padding: 8px 10px;
            border-radius: 0;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .h-btn:hover { background-color: var(--accent-btn); color: var(--hover-text); }
        .h-btn.active { background-color: var(--settings-active-bg); }
        .h-btn.lang { background-color: var(--btn3); }
        .h-btn.preset { background-color: var(--preset-bg); color: var(--preset-text); }
        .h-btn.preset:hover { background-color: var(--preset-hover); color: #fff; }
        .h-btn.star-btn { background-color: var(--accent-btn); color: #fff; font-size: 16px; padding: 8px 12px; }
        .h-btn.star-btn:hover { background-color: var(--accent-btn2); transform: scale(1.05); }

        .settings-box {
            background-color: var(--bg2);
            padding: 14px;
            display: none;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            z-index: 100;
            margin-top: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .s-label { font-size: 14px; color: var(--text3); display: flex; align-items: center; gap: 4px; }

        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

        .tgl-btn {
            flex: 1;
            min-width: 60px;
            background-color: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 8px 6px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tgl-btn:hover { background-color: var(--accent-btn); color: var(--hover-text); }
        .tgl-btn.active {
            background-color: var(--accent-btn);
            color: var(--toggle-active-text);
            border-color: var(--active-border);
            box-shadow: 0 0 8px var(--shadow);
        }

        .dns-select-btn {
            background: var(--accent-btn);
            color: #fff;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .dns-select-btn:hover { background: var(--accent-btn2); }

        .view-select-btn {
            background: var(--btn);
            color: var(--text2);
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .view-select-btn:hover { background: var(--accent-btn); color: #fff; }

        .settings-row { display: flex; gap: 8px; align-items: stretch; width: 100%; }
        .settings-item { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }

        .settings-label { font-size: 13px; color: var(--text3); text-align: center; line-height: 1.3; }

        .settings-item select {
            width: 100%;
            background-color: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 10px 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            text-align-last: center;
            box-sizing: border-box;
        }
        .settings-item select:hover { background-color: var(--accent-btn); color: var(--hover-text); }

        textarea {
            width: 100%;
            height: 160px;
            background-color: var(--input);
            color: var(--input-text);
            border: 1px solid var(--border2);
            padding: 10px;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }
        textarea::placeholder { color: var(--placeholder); }
        textarea:focus { border-color: var(--accent-btn); box-shadow: 0 0 10px var(--shadow); }

        .input-row, .results-row { display: flex; gap: 4px; align-items: stretch; }

        .side-btns { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
        .side-btn {
            background-color: var(--btn2);
            color: var(--text2);
            padding: 6px 8px;
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .side-btn:hover { background-color: var(--accent-btn); color: var(--hover-text); }
        .side-btn.danger:hover { background-color: var(--clear-hover); color: #fff; }

        .main-btn {
            color: #fff;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px var(--shadow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .main-btn.start { background-color: var(--accent-btn); width: 100%; }
        .main-btn.start:hover { background-color: var(--accent-btn2); }
        .main-btn.stop { background-color: #c0392b; display: none; }
        .main-btn.stop:hover { background-color: #e74c3c; }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .progress-bar {
            display: none;
            height: 6px;
            background: var(--progress-bg);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--progress-fill);
            width: 0%;
            transition: width 0.3s ease;
        }

        .dns-indicator, .stats, .time-info {
            color: var(--text3);
            font-size: 12px;
            text-align: center;
            min-height: 14px;
        }
        .stats { font-size: 13px; }
        .line-counter { color: var(--text3); font-size: 11px; text-align: right; min-height: 12px; }

        .search-row { display: flex; gap: 4px; align-items: center; }
        .search-input {
            flex: 1;
            background-color: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }
        .search-input::placeholder { color: var(--placeholder); }
        .search-input:focus { border-color: var(--accent-btn); }

        .results-container { display: none; flex-direction: column; gap: 6px; margin-top: 2px; }
        .results-header { display: flex; justify-content: flex-start; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
        .results-actions { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

        .a-btn {
            background-color: var(--btn3);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .a-btn:hover { background-color: var(--accent-btn); color: var(--hover-text); }
        .a-btn.toggled { background-color: var(--accent-btn); color: #fff; }

        .results-textarea {
            width: 100%;
            height: 160px;
            background-color: var(--bg4);
            border: 1px solid var(--border3);
            color: var(--text4);
            padding: 10px;
            font-size: 15px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            font-family: monospace;
        }
        .results-textarea:focus { border-color: var(--accent-btn); box-shadow: 0 0 10px var(--shadow); }

        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 997;
            background: var(--bg);
            padding: 40px 20px;
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .fullscreen-overlay.show { display: flex; }
        .fullscreen-overlay textarea {
            height: 100%;
            background: var(--bg4);
            color: var(--text4);
            border: 1px solid var(--border3);
            padding: 15px;
            font-size: 16px;
            font-family: monospace;
            resize: none;
        }
        .fullscreen-close {
            position: absolute;
            top: 10px; right: 20px;
            background: var(--accent-btn);
            color: #fff;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 16px;
        }
        .fullscreen-close:hover { background: var(--accent-btn2); }

        .quick-actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .q-btn {
            background-color: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .q-btn:hover { background-color: var(--accent-btn); color: var(--hover-text); }
        .q-btn.toggled { background-color: var(--accent-btn); color: #fff; }

        select {
            background-color: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .easter-egg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--accent-btn);
            color: #fff;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            z-index: 999;
            text-align: center;
            box-shadow: 0 0 40px var(--shadow);
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .easter-egg.show { transform: translate(-50%, -50%) scale(1); }
        .easter-egg .heart { display: inline-block; animation: pulse 0.6s ease-in-out infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }

        input[type="file"] { display: none; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 998;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            color: var(--text2);
            font-size: 14px;
            max-width: 400px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-box button {
            background: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        .modal-box button:hover { background: var(--accent-btn); color: #fff; }

        .star-text { font-size: 14px; color: var(--text2); margin-bottom: 4px; line-height: 1.5; }
        .star-links { display: flex; gap: 6px; }
        .star-link {
            flex: 1;
            background: var(--btn);
            color: var(--text2);
            border: 1px solid var(--border);
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
        }
        .star-link:hover { background: var(--accent-btn); color: #fff; }

        .dns-grid, .view-grid { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .dns-grid label, .view-grid label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            color: var(--text2);
            padding: 8px;
            background: var(--btn);
        }
        .dns-grid label:hover, .view-grid label:hover { background: var(--btn2); }
        .dns-grid input[type="checkbox"], .view-grid input[type="checkbox"] {
            accent-color: var(--accent-btn);
            width: 18px;
            height: 18px;
        }

        .dns-done-btn { background: var(--accent-btn) !important; color: #fff !important; margin-top: 6px; }

        .drop-box {
            background: var(--bg2);
            border: 2px dashed var(--accent-btn);
            padding: 40px;
            text-align: center;
            color: var(--text2);
            font-size: 16px;
            cursor: pointer;
        }
        .drop-box.drag-over { border-color: var(--accent); background: var(--btn2); }

        .toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent-btn);
            color: #fff;
            padding: 10px 20px;
            font-size: 13px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
        }
        .toast.show { animation: toastIn 0.3s forwards, toastOut 0.3s 1.7s forwards; }
        @keyframes toastIn { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
    </style>
</head>
<body>

<div class="easter-egg" id="easterEgg">
    <span data-i18n="easter">Спасибо за использование</span> <span class="heart">❤️</span>
</div>

<div class="modal-overlay" id="dropOverlay" onclick="hideModal('dropOverlay')">
    <div class="drop-box" id="dropBox" onclick="event.stopPropagation()">
        <span data-i18n="dropText">📂 Перетащите файл сюда или нажмите, чтобы выбрать</span>
        <input type="file" id="dropFileInput" accept="*" onchange="handleFile(this, true)" style="display:none">
    </div>
</div>

<div class="modal-overlay" id="exportMenu" onclick="hideModal('exportMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-weight:bold" data-i18n="exportTitle">📥 Экспорт</div>
        <button onclick="exportFile('txt')">📄 TXT</button>
        <button onclick="exportFile('csv')">📊 CSV</button>
        <button onclick="exportFile('json')">📋 JSON</button>
        <button onclick="exportFile('md')">📝 Markdown</button>
    </div>
</div>

<div class="modal-overlay" id="dnsMenu" onclick="hideModal('dnsMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-weight:bold" data-i18n="dnsMenuTitle">📡 Выберите DNS серверы</div>
        <div class="dns-grid" id="dnsGrid"></div>
        <button class="dns-done-btn" onclick="hideModal('dnsMenu')" data-i18n="dnsDoneBtn">✅ Готово</button>
    </div>
</div>

<div class="modal-overlay" id="viewMenu" onclick="hideModal('viewMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-weight:bold" data-i18n="viewMenuTitle">👁️ Вид результатов</div>
        <div class="view-grid" id="viewGrid"></div>
        <button class="dns-done-btn" onclick="hideModal('viewMenu')" data-i18n="viewDoneBtn">✅ Готово</button>
    </div>
</div>

<div class="modal-overlay" id="starMenu" onclick="hideModal('starMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="star-text" data-i18n="starText">Хэй! Поддержи мой полностью бесплатный проект звёздочкой, иначе укушу твоё ушко :Р</div>
        <div class="star-links">
            <a href="https://github.com/Michi-Mochirellune/dns-resolver-michigan" target="_blank" class="star-link">⭐ GitHub</a>
            <a href="https://t.me/MichiMochirellune" target="_blank" class="star-link">📢 Telegram</a>
        </div>
    </div>
</div>

<div class="fullscreen-overlay" id="fsInput">

function t(key, ...args) {
    const str = L[currentLanguage][key];
    return typeof str === 'function' ? str(...args) : str;
}

// ─────────────────────────────────────────────
//  🌍 i18n engine
// ─────────────────────────────────────────────
function applyI18N() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (L[currentLanguage][key]) {
            el.textContent = L[currentLanguage][key];
        }
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (L[currentLanguage][key]) {
            el.setAttribute('placeholder', L[currentLanguage][key]);
        }
    });

    document.querySelectorAll('[data-i18n-format]').forEach(el => {
        const key   = el.getAttribute('data-i18n-format');
        const param = el.getAttribute('data-format-param');
        const fn    = L[currentLanguage][key];
        if (typeof fn === 'function') {
            el.textContent = fn(param);
        } else if (fn) {
            el.textContent = fn;
        }
    });

    document.querySelectorAll('[data-i18n-options]').forEach(el => {
        const parts = el.getAttribute('data-i18n-options').split('.');
        const key   = parts[0];
        const idx   = parseInt(parts[1], 10);
        if (L[currentLanguage][key] && Array.isArray(L[currentLanguage][key])) {
            el.textContent = L[currentLanguage][key][idx] || el.textContent;
        }
    });

    updateRecordTypeOptions();
}

function updateRecordTypeOptions() {
    const labels = {
        MX:  '📧 MX (' + t('mxLabel') + ')',
        NS:  '🗄️ NS (' + t('nsLabel') + ')',
        SOA: '📋 SOA (' + t('soaLabel') + ')',
        TXT: '📝 TXT (' + t('txtLabel') + ')',
    };
    const sel = document.getElementById('recordType');
    for (let i = 0; i < sel.options.length; i++) {
        const opt = sel.options[i];
        if (labels[opt.value]) {
            opt.textContent = labels[opt.value];
        }
    }
}

// ═══════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════
function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) {
        el = document.createElement('div');
        el.className = 'toast';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════
//  Theme
// ═══════════════════════════════════════════
function applyTheme() {
    document.body.classList.remove('light', 'xp');
    if (themeMode === 'system') {
        if (window.matchMedia('(prefers-color-scheme: light)').matches) document.body.classList.add('light');
    } else if (themeMode === 'light') {
        document.body.classList.add('light');
    } else if (themeMode === 'xp') {
        document.body.classList.add('xp');
    }
    updateThemeIcon();
    updateLogo();
}

function updateThemeIcon() {
    const btn = document.getElementById('themeToggleBtn');
    const icons = { system: '🔄', light: '☀️', xp: 'XP', dark: '🌙' };
    btn.textContent = icons[themeMode] || '🌙';
}

function cycleTheme() {
    const order = ['system', 'light', 'xp', 'dark'];
    themeMode = order[(order.indexOf(themeMode) + 1) % order.length];
    updateThemeIcon();
    applyTheme();
    try { localStorage.setItem('dnsresolver_theme', themeMode); } catch (e) {}
}

function updateLogo() {
    const el = document.getElementById('logo');
    const logos = {
        light: 'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logow.png',
        xp:    'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logoxp.png',
    };
    el.src = logos[themeMode] || 'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png';
}

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (themeMode === 'system') applyTheme();
});

function setRecordType(val) { recordType = val; }
function setTimeoutVal(s)   { timeout = s * 1000; document.getElementById('timeoutSelect').value = String(s); }
function setDelay(d)        { delay = d; document.getElementById('delaySelect').value = String(d); }
function setShowTTL(v)      { showTTL = v;      applyAllFilters(); }
function setShowDNSNames(v) { showDNSNames = v; applyAllFilters(); }
function setShowSep(v)      { showSep = v;      applyAllFilters(); }
function setShowSpeed(v)    { showSpeed = v;    applyAllFilters(); }

// ═══════════════════════════════════════════
//  DNS server menu
// ═══════════════════════════════════════════
function showDNSMenu() {
    const grid = document.getElementById('dnsGrid');
    const rows = [];
    for (const key in allDNSServers) {
        const s = allDNSServers[key];
        const checked = activeServers.includes(key) ? 'checked' : '';
        rows.push(`<label><input type="checkbox" value="${key}" ${checked} onchange="toggleServer('${key}', this.checked)">${s.name}</label>`);
    }
    grid.innerHTML = rows.join('');
    showModal('dnsMenu');
}

function toggleServer(key, checked) {
    if (checked) {
        if (!activeServers.includes(key)) activeServers.push(key);
    } else {
        activeServers = activeServers.filter(k => k !== key);
    }
    updateDNSButtonText();
    updateProviderFilter();
}

function updateDNSButtonText() {
    const btn = document.querySelector('.dns-select-btn');
    if (btn) {
        btn.setAttribute('data-format-param', activeServers.length);
        btn.textContent = t('dnsSelectBtn', activeServers.length);
    }
}

// ═══════════════════════════════════════════
//  View menu
// ═══════════════════════════════════════════
function showViewMenu() {
    const grid = document.getElementById('viewGrid');
    grid.innerHTML = [
        `<label><input type="checkbox" ${showDNSNames ? 'checked' : ''} onchange="setShowDNSNames(this.checked)">${t('showDNSNamesLabel')}</label>`,
        `<label><input type="checkbox" ${showSep     ? 'checked' : ''} onchange="setShowSep(this.checked)">${t('showSepLabel')}</label>`,
        `<label><input type="checkbox" ${showTTL     ? 'checked' : ''} onchange="setShowTTL(this.checked)">${t('showTTLLabel')}</label>`,
        `<label><input type="checkbox" ${showSpeed   ? 'checked' : ''} onchange="setShowSpeed(this.checked)">${t('showSpeedLabel')}</label>`,
    ].join('');
    showModal('viewMenu');
}

function openFS(overlayId, sourceId, targetId) {
    document.getElementById(targetId).value = document.getElementById(sourceId).value;
    document.getElementById(overlayId).classList.add('show');
}
function closeFS(id) { document.getElementById(id).classList.remove('show'); }

// ═══════════════════════════════════════════
//  Clipboard
// ═══════════════════════════════════════════
function copyTextarea(id) {
    const text = document.getElementById(id).value;
    if (!text.trim()) { toast(t('emptyToast')); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(() => toast(t('copied')))
            .catch(() => fallbackCopy(id));
    } else {
        fallbackCopy(id);
    }
}

function fallbackCopy(id) {
    const ta = document.getElementById(id);
    ta.select();
    ta.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        toast(t('copied'));
    } catch (e) {
        toast(t('copyFail'));
    }
    ta.blur();
}

// ═══════════════════════════════════════════
//  File import
// ═══════════════════════════════════════════
function handleFile(input, isDrop) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        document.getElementById('inputDomains').value = e.target.result;
        allInputDomains = e.target.result;
        updateLineCounter();
        if (isDrop) hideModal('dropOverlay');
        toast(t('imported'));
    };
    reader.onerror = () => toast(t('importFail'));
    reader.readAsText(file);
    input.value = '';
}

// Drop zone
document.getElementById('dropBox').addEventListener('click', () => document.getElementById('dropFileInput').click());
document.getElementById('dropBox').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); });
document.getElementById('dropBox').addEventListener('dragleave', e => { e.currentTarget.classList.remove('drag-over'); });
document.getElementById('dropBox').addEventListener('drop', e => {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('dropFileInput').files = dt.files;
        handleFile(document.getElementById('dropFileInput'), true);
    }
});

// ═══════════════════════════════════════════
//  Domain input helpers
// ═══════════════════════════════════════════
function updateLineCounter() {
    const lines = document.getElementById('inputDomains').value.split('\n').filter(l => l.trim().length > 0);
    const label = currentLanguage === 'ru' ? `📊 Строк: ${lines.length}` : `📊 Lines: ${lines.length}`;
    document.getElementById('lineCounter').innerText = lines.length > 0 ? label : '';
}

function filterInputDomains() {
    const query = document.getElementById('inputSearch').value.toLowerCase();
    const ta = document.getElementById('inputDomains');
    if (!allInputDomains && ta.value) allInputDomains = ta.value;
    const source = allInputDomains || ta.value;
    if (!query.trim()) { ta.value = source; updateLineCounter(); return; }
    ta.value = source.split('\n').filter(l => l.toLowerCase().includes(query)).join('\n');
    updateLineCounter();
}

function addPreset(text) {
    document.getElementById('inputDomains').value = text;
    allInputDomains = text;
    updateLineCounter();
    toast(t('presetAdded'));
}

function dedupDomains() {
    const ta = document.getElementById('inputDomains');
    const unique = [...new Set(ta.value.split('\n').map(l => l.trim().toLowerCase()).filter(l => l.length > 0))];
    ta.value = unique.join('\n');
    allInputDomains = ta.value;
    updateLineCounter();
    toast(t('dupsRemoved'));
}

function clearInputOnly() {
    document.getElementById('inputDomains').value = '';
    document.getElementById('inputSearch').value = '';
    allInputDomains = '';
    updateLineCounter();
    toast(t('cleared'));
}

// ═══════════════════════════════════════════
//  Results helpers
// ═══════════════════════════════════════════
function clearResultsOnly() {
    document.getElementById('resultsBox').value = '';
    document.getElementById('resultsContainer').style.display = 'none';
    document.getElementById('stats').innerText = '';
    document.getElementById('timeInfo').innerText = '';
    document.getElementById('dnsIndicator').innerText = '';
    document.getElementById('resultsSearch').value = '';
    currentResults = [];
    toast(t('cleared'));
}

function cycleFilter() {
    const order = ['all', 'success', 'errors'];
    filterMode = order[(order.indexOf(filterMode) + 1) % order.length];
    const btn = document.getElementById('filterBtn');
    btn.setAttribute('data-format-param', filterMode);
    btn.textContent = t('filterBtn', filterMode);
    applyAllFilters();
}

function dedupResults() {
    if (!currentResults.length) return;
    const seen = new Set();
    currentResults = currentResults.filter(r => {
        if (r.error) return true;
        if (seen.has(r.ip)) return false;
        seen.add(r.ip);
        return true;
    });
    applyAllFilters();
    toast(t('dupsRemoved'));
}

function applyAllFilters() {
    if (!currentResults.length) {
        document.getElementById('resultsBox').value = '';
        updateStatsDisplay();
        return;
    }
    let filtered = [...currentResults];
    if (filterMode === 'success') filtered = filtered.filter(r => !r.error);
    else if (filterMode === 'errors') filtered = filtered.filter(r => r.error);

    const providerFilter = document.getElementById('providerFilter').value;
    if (providerFilter !== 'all') filtered = filtered.filter(r => r.server === providerFilter);

    const query = document.getElementById('resultsSearch').value.toLowerCase();
    if (query.trim()) {
        filtered = filtered.filter(r =>
            r.domain.toLowerCase().includes(query) ||
            (r.ip || '').toLowerCase().includes(query) ||
            (r.server || '').toLowerCase().includes(query)
        );
    }
    displayResults(filtered);
    updateStatsDisplay();
}

function displayResults(results) {
    const lines = [];
    for (let i = 0; i < results.length; i++) {
        const r = results[i];
        if (r.error) {
            lines.push(outputFormat === 'hosts' ? `${t('errorHosts')} ${r.domain}` : `${t('errorHosts')} ${r.domain}`);
        } else {
            let extras = '';
            if (showTTL && r.ttl) extras += ` | TTL: ${r.ttl}s`;
            if (showSpeed && r.responseTime) extras += ` | ⚡ ${r.responseTime} ms`;
            const prefix = showDNSNames && r.server && allDNSServers[r.server]
                ? allDNSServers[r.server].short + ': '
                : '';
            lines.push(outputFormat === 'hosts'
                ? `${prefix}${r.ip} ${r.domain}${extras}`
                : `${prefix}${r.ip}${extras}`
            );
        }
        if (showSep && i < results.length - 1) lines.push('');
    }
    document.getElementById('resultsBox').value = lines.join('\n');
    updateStatsDisplay();
}

function updateStatsDisplay() {
    if (!currentResults.length) { document.getElementById('stats').innerText = ''; return; }
    const found  = currentResults.filter(r => !r.error).length;
    const errors = currentResults.length - found;
    const ips    = new Set(currentResults.filter(r => !r.error && r.ip).map(r => r.ip));
    document.getElementById('stats').innerText = t('stats', found, errors, currentResults.length, ips.size);
}

function updateProviderFilter() {
    const sel = document.getElementById('providerFilter');
    while (sel.options.length > 1) sel.remove(1);
    for (const s of activeServers) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = allDNSServers[s] ? allDNSServers[s].name : s;
        sel.appendChild(opt);
    }
    sel.options[0].textContent = t('providerAll');
}

// ═══════════════════════════════════════════
//  Export
// ═══════════════════════════════════════════
function exportFile(format) {
    if (!currentResults.length) { toast(t('emptyToast')); return; }

    let content = '', mime = 'text/plain', ext = 'txt';

    if (format === 'csv') {
        const header = ['Domain', 'IP', 'Status', showTTL ? 'TTL' : null].filter(Boolean).join(',');
        const rows = currentResults.map(r => [
            r.domain,
            r.ip || '',
            r.error ? 'Error' : 'OK',
            showTTL ? (r.ttl || '') : null,
        ].filter((_, i) => !(!showTTL && i === 3)).join(','));
        content = [header, ...rows].join('\n');
        mime = 'text/csv'; ext = 'csv';
    } else if (format === 'json') {
        content = JSON.stringify(currentResults.map(r => ({
            domain:       r.domain,
            ip:           r.ip || null,
            error:        r.error,
            ttl:          showTTL ? (r.ttl || null) : undefined,
            dnssec:       r.dnssec || false,
            responseTime: r.responseTime || null,
            server:       r.server || null,
        })), null, 2);
        mime = 'application/json'; ext = 'json';
    } else if (format === 'md') {
        const headerRow = ['| Domain | IP | Status |', showTTL ? ' TTL |' : ''].join('');
        const sepRow    = ['|:---|:---|:---|',          showTTL ? ':---|' : ''].join('');
        const dataRows  = currentResults.map(r =>
            `| ${r.domain} | ${r.ip || '-'} | ${r.error ? '❌' : '✅'} |${showTTL ? ` ${r.ttl || ''} |` : ''}`
        );
        content = [headerRow, sepRow, ...dataRows].join('\n');
        mime = 'text/markdown'; ext = 'md';
    } else {
        content = document.getElementById('resultsBox').value || '';
    }

    const blob = new Blob([content], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: `dns-results.${ext}` });
    a.click();
    URL.revokeObjectURL(url);
    toast(t('exported'));
}

// ═══════════════════════════════════════════
//  DNS Resolution
// ═══════════════════════════════════════════
async function resolveSingle(domain, serverKey, type, externalSignal) {
    const startTime = Date.now();
    const localController = new AbortController();
    const timer = setTimeout(() => localController.abort(), timeout);
    const onGlobalAbort = () => localController.abort();
    if (externalSignal) externalSignal.addEventListener('abort', onGlobalAbort);
    try {
        const apiUrl = allDNSServers[serverKey]?.url ?? 'https://cloudflare-dns.com/dns-query';
        const res = await fetch(`${apiUrl}?name=${encodeURIComponent(domain)}&type=${type}`, {
            headers: { Accept: 'application/dns-json' },
            signal: localController.signal,
        });
        clearTimeout(timer);
        if (externalSignal) externalSignal.removeEventListener('abort', onGlobalAbort);
        const data   = await res.json();
        const dnssec = !!data.AD;
        let result = null, ttl = null;
        if (data.Answer?.length > 0) {
            if (type === 'MX') {
                const mx = data.Answer.filter(r => r.type === 15).sort((a, b) => a.preference - b.preference);
                if (mx.length) { result = mx.map(r => r.data).join(', '); ttl = mx[0].TTL; }
            } else if (type === 'NS') {
                const ns = data.Answer.filter(r => r.type === 2);
                if (ns.length) { result = ns.map(r => r.data).join(', '); ttl = ns[0].TTL; }
            } else if (type === 'TXT') {
                const txt = data.Answer.filter(r => r.type === 16);
                if (txt.length) { result = txt.map(r => r.data).join(' | '); ttl = txt[0].TTL; }
            } else if (type === 'SOA') {
                const soa = data.Answer.find(r => r.type === 6);
                if (soa) { result = soa.data; ttl = soa.TTL; }
            } else {
                const rec = data.Answer.find(r => r.type === recordTypes[type]);
                if (rec) { result = rec.data; ttl = rec.TTL; }
            }
        }
        return { result, ttl, dnssec, size: JSON.stringify(data).length, responseTime: Date.now() - startTime };
    } catch (e) {
        clearTimeout(timer);
        if (externalSignal) externalSignal.removeEventListener('abort', onGlobalAbort);
        return { error: true, responseTime: Date.now() - startTime };
    }
}

async function startResolving() {
    const rb          = document.getElementById('resultsBox');
    const rc          = document.getElementById('resultsContainer');
    const stats       = document.getElementById('stats');
    const timeInfo    = document.getElementById('timeInfo');
    const dnsInd      = document.getElementById('dnsIndicator');
    const startBtn    = document.getElementById('startBtn');
    const stopBtn     = document.getElementById('stopBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill= document.getElementById('progressFill');

    if (activeServers.length === 0) {
        rc.style.display = 'flex';
        stats.innerText = '';
        timeInfo.innerText = '';
        dnsInd.innerText = '';
        rb.value = t('noServers');
        updateStatsDisplay();
        return;
    }

    let rawText = document.getElementById('inputDomains').value
        .replace(/https?:\/\//g, '')
        .replace(/\/.*/g, '');
    const domains = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    if (domains.length === 0) {
        rc.style.display = 'none';
        rb.value = t('empty');
        toast(t('noDomainsToast'));
        return;
    }

    allInputDomains = document.getElementById('inputDomains').value;
    rc.style.display = 'flex';
    stats.innerText = '';
    timeInfo.innerText = '';
    dnsInd.innerText = '';
    rb.value = '';
    startBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    stopBtn.textContent = t('stopBtn');
    stopBtn.disabled = false;
    progressBar.style.display = 'block';
    progressFill.style.width = '0%';
    currentResults = [];
    resolveStartTime = Date.now();

    const names = activeServers.map(k => allDNSServers[k]?.name ?? k).join(', ');
    dnsInd.innerText = t('dnsIndicator', names);
    toast(t('started'));

    abortController = new AbortController();
    const signal = abortController.signal;

    let found = 0, errors = 0, totalSize = 0;

    for (let i = 0; i < domains.length; i++) {
        if (signal.aborted) break;
        const domain = domains[i];
        const tasks = activeServers.map(s => resolveSingle(domain, s, recordType, signal));
        const results = await Promise.all(tasks);
        for (let j = 0; j < results.length; j++) {
            if (signal.aborted) break;
            const res = results[j];
            const s   = activeServers[j];
            if (res && res.result) {
                found++;
                totalSize += res.size;
                currentResults.push({
                    domain, ip: res.result, error: false,
                    ttl: res.ttl ?? null, dnssec: res.dnssec,
                    size: res.size, server: s, responseTime: res.responseTime ?? null,
                });
            } else {
                errors++;
                currentResults.push({
                    domain, ip: null, error: true,
                    size: 0, server: s, responseTime: res?.responseTime ?? null,
                });
            }
        }
        const uniqueIPs = new Set(currentResults.filter(r => !r.error && r.ip).map(r => r.ip));
        stats.innerText = t('stats', found, errors, i + 1, uniqueIPs.size);
        progressFill.style.width = `${((i + 1) / domains.length) * 100}%`;
        if (delay > 0 && i < domains.length - 1 && !signal.aborted) {
            await new Promise(r => setTimeout(r, delay));
        }
    }

    updateProviderFilter();
    applyAllFilters();

    const elapsed = ((Date.now() - resolveStartTime) / 1000).toFixed(1);
    const sizeKB  = (totalSize / 1024).toFixed(1);
    timeInfo.innerText = t('timeInfo', elapsed, sizeKB);

    abortController = null;
    stopResolving();
}

function stopResolving() {
    if (abortController) {
        abortController.abort();
        abortController = null;
    }
    const startBtn = document.getElementById('startBtn');
    startBtn.style.display  = 'inline-block';
    startBtn.disabled = false;
    startBtn.textContent = t('startBtn');
    document.getElementById('stopBtn').style.display   = 'none';
    document.getElementById('progressBar').style.display = 'none';
}

//  Easter egg

function easterClick() {
    easterClicks++;
    if (easterClicks >= 3) {
        document.getElementById('easterEgg').classList.add('show');
        setTimeout(() => document.getElementById('easterEgg').classList.remove('show'), 2500);
        easterClicks = 0;
    }
}

// ═══════════════════════════════════════════
function toggleFormat() {
    outputFormat = outputFormat === 'hosts' ? 'onlyip' : 'hosts';
    updateFormatButtonText();
    applyAllFilters();
}

function updateFormatButtonText() {
    const btn = document.getElementById('formatBtn');
    btn.setAttribute('data-format-param', outputFormat);
    btn.textContent = t('formatBtn', outputFormat);
    btn.classList.toggle('active', outputFormat === 'hosts');
}

function updateSettingsButtonText() {
    const sb  = document.getElementById('settingsBox');
    const span = document.querySelector('#settingsToggleBtn span');
    if (sb.style.display === 'flex') {
        span.textContent = t('closeSettings');
    } else {
        span.textContent = t('settings');
    }
}
