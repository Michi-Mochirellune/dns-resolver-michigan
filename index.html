<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Resolver by Michigan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0712;
            color: #e6dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 5px;
        }

        h1 {
            color: #ba8cff;
            font-size: 22px;
            margin: 0;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(186, 140, 255, 0.3);
        }

        .settings-toggle {
            background-color: #402666;
            color: #e6ccff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .settings-toggle:hover { background-color: #59358c; }

        .settings-box {
            background-color: #160f24;
            border-radius: 8px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #321f4d;
        }

        .settings-label { font-size: 14px; color: #9980b3; }

        .btn-group { display: flex; gap: 8px; }

        .toggle-btn {
            flex: 1;
            background-color: #251a3a;
            color: #bfa6ff;
            border: 1px solid #4d3380;
            padding: 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background-color: #782ec7;
            color: #ffffff;
            border-color: #9445ff;
            box-shadow: 0 0 8px rgba(120, 46, 199, 0.5);
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: #1f142e;
            color: #e6e1ff;
            border: 1px solid #442a66;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
        }

        textarea:focus { border-color: #9e52ff; }

        .start-btn {
            background-color: #782ec7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(120, 46, 199, 0.3);
        }

        .start-btn:hover { background-color: #8c3be0; }

        .results-textarea {
            width: 100%;
            height: 200px;
            background-color: #130c1f;
            border: 1px solid #281840;
            color: #d4c7e8;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            font-family: monospace;
            display: none;
        }

        .copy-hint {
            color: #9980b3;
            font-size: 14px;
            text-align: center;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DNS Resolver by Michigan</h1>
        <button class="settings-toggle" id="settingsToggleBtn" onclick="toggleSettings()">⚙ Настройки</button>
    </div>

    <div class="settings-box" id="settingsBox">
        <div class="settings-label">Выбор DNS сервера:</div>
        <div class="btn-group">
            <button class="toggle-btn active" id="dnsCloudflare" onclick="setDns('cloudflare')">Cloudflare</button>
            <button class="toggle-btn" id="dnsGoogle" onclick="setDns('google')">Google</button>
        </div>

        <div class="btn-group">
            <button class="toggle-btn" id="formatBtn" onclick="toggleFormat()">Формат: Classic</button>
            <button class="toggle-btn" id="fontBtn" onclick="cycleFont()">Шрифт: Обычный</button>
        </div>
    </div>

    <textarea id="inputDomains" placeholder="Вставь список доменов сюда..."></textarea>

    <button class="start-btn" onclick="startResolving()">Узнать IP адреса</button>

    <textarea id="resultsBox" class="results-textarea" readonly placeholder="Результаты появятся здесь..."></textarea>
    
    <div id="copyHint" class="copy-hint">💡 Зажми палец на тексте выше, чтобы скопировать результаты</div>
</div>

<script>
    let dnsProvider = 'cloudflare';
    let outputFormat = 'classic';
    let fontSizeState = 0;
    const fontSizes = ['16px', '19px', '23px'];
    const fontLabels = ['Обычный', 'Средний', 'Крупный'];

    function toggleSettings() {
        const box = document.getElementById('settingsBox');
        const btn = document.getElementById('settingsToggleBtn');
        if (box.style.display === 'flex') {
            box.style.display = 'none';
            btn.innerText = '⚙ Настройки';
        } else {
            box.style.display = 'flex';
            btn.innerText = '✕ Закрыть';
        }
    }

    function setDns(provider) {
        dnsProvider = provider;
        document.getElementById('dnsCloudflare').classList.toggle('active', provider === 'cloudflare');
        document.getElementById('dnsGoogle').classList.toggle('active', provider === 'google');
    }

    function toggleFormat() {
        const btn = document.getElementById('formatBtn');
        if (outputFormat === 'classic') {
            outputFormat = 'hosts';
            btn.innerText = '[✔] Формат: Hosts';
            btn.classList.add('active');
        } else {
            outputFormat = 'classic';
            btn.innerText = 'Формат: Classic';
            btn.classList.remove('active');
        }
    }

    function cycleFont() {
        fontSizeState = (fontSizeState + 1) % 3;
        const newSize = fontSizes[fontSizeState];
        document.getElementById('fontBtn').innerText = 'Шрифт: ' + fontLabels[fontSizeState];
        document.getElementById('inputDomains').style.fontSize = newSize;
        document.getElementById('resultsBox').style.fontSize = newSize;
    }

    async function startResolving() {
        const inputText = document.getElementById('inputDomains').value.trim();
        const resultsBox = document.getElementById('resultsBox');
        const copyHint = document.getElementById('copyHint');

        resultsBox.style.display = 'block';
        copyHint.style.display = 'none';
        resultsBox.value = '🔄 Идет проверка...\n';

        const domains = inputText.split('\n').map(line => line.trim()).filter(line => line.length > 0);

        if (domains.length === 0) {
            resultsBox.value = 'Список пуст.';
            return;
        }

        let output = [];
        const apiUrl = dnsProvider === 'google' 
            ? 'https://dns.google/resolve' 
            : 'https://cloudflare-dns.com/dns-query';

        for (let domain of domains) {
            try {
                let response = await fetch(`\( {apiUrl}?name= \){encodeURIComponent(domain)}&type=A`, {
                    headers: { 'Accept': 'application/dns-json' }
                });

                let data = await response.json();
                
                let ip = data.Answer?.find(record => record.type === 1)?.data;

                if (ip) {
                    if (outputFormat === 'hosts') {
                        output.push(`${ip} ${domain}`);
                    } else {
                        output.push(`[ + ] ${domain}  →  ${ip}`);
                    }
                } else {
                    throw new Error();
                }
            } catch (e) {
                if (outputFormat === 'hosts') {
                    output.push(`# [Ошибка] ${domain}`);
                } else {
                    output.push(`[ - ] ${domain}  →  [Ошибка/Не найден]`);
                }
            }
            
            resultsBox.value = output.join('\n');
        }

        if (output.length > 0) {
            copyHint.style.display = 'block';
        }
    }
</script>
</body>
</html>
