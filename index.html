<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dns resolver Michigan</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        button, select, textarea { font-family: inherit; font-size: inherit; line-height: inherit; border: none; background: none; color: inherit; -webkit-appearance: none; -moz-appearance: none; appearance: none; }

        :root {
            --bg: #0b0712; --bg2: #160f24; --bg3: #1f142e; --bg4: #130c1f;
            --text: #e6dbff; --text2: #bfa6ff; --text3: #9980b3; --text4: #d4c7e8;
            --border: #321f4d; --border2: #442a66; --border3: #281840;
            --btn: #251a3a; --btn2: #402666; --btn3: #2d1a4a;
            --accent: #d4a8ff; --accent2: #e0c4ff;
            --accent-btn: #782ec7; --accent-btn2: #8c3be0;
            --input: #1f142e; --input-text: #e6e1ff; --placeholder: #665980;
            --bg-img: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bg.jpg');
            --overlay: rgba(11, 7, 18, 0.6);
            --preset-bg: #2c8c3c; --preset-text: #fff; --preset-hover: #1e7a45;
            --shadow: rgba(212, 168, 255, 0.3);
            --clear-hover: #c0392b;
            --toggle-active-text: #fff; --hover-text: #fff;
            --active-border: #9445ff;
            --settings-active-bg: #402666;
            --progress-bg: #251a3a; --progress-fill: #782ec7;
            --label-color: #c4aaee;
            --card-bg: rgba(11, 7, 18, 0.55);
            --stats-value-color: var(--accent-btn);
        }
        .light {
            --bg: #fefefe; --bg2: #f5f5f5; --bg3: #eee; --bg4: #f5f5f5;
            --text: #333; --text2: #555; --text3: #939394; --text4: #444;
            --border: #ddd; --border2: #ccc; --border3: #ddd;
            --btn: #f0f0f0; --btn2: #e8e8e8; --btn3: #eee;
            --accent: #666; --accent2: #777;
            --accent-btn: #888; --accent-btn2: #999;
            --input: #f5f5f5; --input-text: #333; --placeholder: #aaa;
            --bg-img: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgw.jpg');
            --overlay: rgba(254, 254, 254, 0.7);
            --preset-bg: #2c8c3c; --preset-text: #fff; --preset-hover: #1e7a45;
            --shadow: rgba(0, 0, 0, 0.1);
            --clear-hover: #c0392b;
            --toggle-active-text: #333; --hover-text: #333;
            --active-border: #aaa; --settings-active-bg: #d5d5d5;
            --progress-bg: #e0e0e0; --progress-fill: #888;
            --label-color: #444;
            --card-bg: rgba(255, 255, 255, 0.6);
            --stats-value-color: var(--accent-btn);
        }
        .xp {
            --bg: #3881f4; --bg2: #2360c4; --bg3: #1a4ab0; --bg4: #1a3a6a;
            --text: #ffffff; --text2: #ffffff; --text3: #e0e8ff; --text4: #ffffff;
            --border: #5a9af5; --border2: #4a8ae5; --border3: #3a7ad5;
            --btn: #2d6cd4; --btn2: #2360c4; --btn3: #1a4ab0;
            --accent: #6aafff; --accent2: #8ac0ff;
            --accent-btn: #4a8ae5; --accent-btn2: #3a7ad5;
            --input: #2360c4; --input-text: #ffffff; --placeholder: #e0e8ff;
            --bg-img: url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgxp.png');
            --overlay: rgba(0, 0, 0, 0.1);
            --preset-bg: #2c8c3c; --preset-text: #ffffff; --preset-hover: #1e7a45;
            --shadow: rgba(0, 0, 0, 0.3);
            --clear-hover: #c0392b;
            --toggle-active-text: #ffffff; --hover-text: #ffffff;
            --active-border: #6aafff; --settings-active-bg: #1a4ab0;
            --progress-bg: #1a4ab0; --progress-fill: #6aafff;
            --label-color: #ffffff;
            --card-bg: rgba(0, 0, 0, 0.3);
            --stats-value-color: #ffffff;
        }

        body {
            background-color: var(--bg);
            background-image: var(--bg-img);
            background-size: cover;
            background-position: center;
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--overlay);
            z-index: 0;
            transition: background-color 0.4s ease;
        }
        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        @media (min-width: 900px) { .container { max-width: 650px; } }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; position: relative; }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo { height: 45px; cursor: pointer; transition: filter 0.3s ease; }
        .logo:hover { filter: drop-shadow(0 0 8px var(--shadow)); }
        .header-buttons { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .h-btn {
            background-color: var(--btn2); color: var(--text2); padding: 6px 12px;
            cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .h-btn:hover { background-color: var(--accent-btn); color: #fff; }
        .h-btn.preset { background-color: var(--preset-bg); color: #fff; }
        .h-btn.preset:hover { background-color: var(--preset-hover); }
        .h-btn.star-btn { background-color: var(--accent-btn); color: #fff; }

        .settings-box {
            background-color: var(--bg2); padding: 14px; display: none; flex-direction: column; gap: 10px;
            border: 1px solid var(--border); position: absolute; top: 100%; left: 50%;
            transform: translateX(-50%); width: 100%; z-index: 100; margin-top: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }
        .settings-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .settings-item { flex: 1; min-width: 100px; display: flex; flex-direction: column; gap: 4px; }
        .settings-label { font-size: 12px; color: var(--text3); text-align: center; }
        .settings-item select, .settings-item button {
            background: var(--btn); color: var(--text2); border: 1px solid var(--border);
            padding: 8px; font-size: 12px; cursor: pointer; text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .settings-item select:hover, .settings-item button:hover { background: var(--accent-btn); color: #fff; }
        .dns-select-btn, .view-select-btn { background: var(--accent-btn); color: #fff; padding: 10px; cursor: pointer; text-align: center; }
        .tgl-btn { background: var(--btn); color: var(--text2); border: 1px solid var(--border); padding: 8px; cursor: pointer; font-size: 12px; transition: background-color 0.3s ease, color 0.3s ease; }
        .tgl-btn:hover { background: var(--accent-btn); color: #fff; }

        .glass-card {
            background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border);
            padding: 14px; display: flex; flex-direction: column; gap: 12px;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }
        .xp .glass-card { backdrop-filter: none; }

        .search-input {
            width: 100%; background: var(--btn); color: var(--text2); border: 1px solid var(--border);
            padding: 12px; font-size: 14px; outline: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .search-input::placeholder { color: var(--placeholder); }
        .search-input:focus { border-color: var(--accent-btn); }

        .input-wrapper { display: flex; gap: 8px; align-items: stretch; }
        textarea {
            flex: 1; height: 140px; background: var(--input); color: var(--input-text);
            border: 1px solid var(--border2); padding: 10px; font-size: 13px;
            font-family: monospace; resize: vertical; outline: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        textarea::placeholder { color: var(--placeholder); }
        textarea:focus { border-color: var(--accent-btn); }

        .side-btns { display: flex; flex-direction: column; gap: 6px; }
        .side-btn {
            background: var(--btn2); color: var(--text2); padding: 8px 12px;
            cursor: pointer; text-align: center; font-size: 14px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .side-btn:hover { background: var(--accent-btn); color: #fff; }
        .side-btn.danger:hover { background: var(--clear-hover); }

        .card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .line-counter { font-size: 12px; color: var(--text2); padding: 6px 14px; display: none; }
        .line-counter.has-content { display: inline-block; background: var(--btn); }
        .card-buttons { display: flex; gap: 8px; margin-left: auto; }
        .card-btn {
            background: var(--btn); color: var(--text2); border: 1px solid var(--border);
            padding: 6px 14px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .card-btn:hover { background: var(--accent-btn); color: #fff; }

        .main-btn { color: #fff; padding: 14px; font-size: 18px; font-weight: bold; cursor: pointer; text-align: center; transition: background-color 0.3s ease, opacity 0.3s ease; }
        .main-btn.start { background: var(--accent-btn); width: 100%; }
        .main-btn.start:hover { background: var(--accent-btn2); }
        .main-btn.stop { background: #c0392b; display: none; width: 100%; }
        .main-btn.stop:hover { background: #e74c3c; }

        .progress-bar { display: none; height: 4px; background: var(--progress-bg); margin: 4px 0; transition: background-color 0.3s ease; }
        .progress-fill { height: 100%; background: var(--progress-fill); width: 0%; transition: width 0.3s ease, background-color 0.3s ease; }

        .tabs-container { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border); transition: background-color 0.4s ease, border-color 0.4s ease; }
        .xp .tabs-container { backdrop-filter: none; }
        .tabs-header { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); transition: background-color 0.4s ease, border-color 0.4s ease; }
        .tab-btn {
            flex: 1; padding: 12px 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            text-align: center; color: var(--text3); background: transparent;
            transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        .tab-btn.active { color: var(--accent-btn); border-bottom: 2px solid var(--accent-btn); background: var(--card-bg); }
        .tab-btn:hover:not(.active) { color: var(--text2); background: var(--btn3); }
        .tab-content { display: none; padding: 14px; }
        .tab-content.active { display: block; }

        .results-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .a-btn {
            background: var(--btn3); color: var(--text2); border: 1px solid var(--border);
            padding: 6px 12px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .a-btn:hover { background: var(--accent-btn); color: #fff; }
        .results-search {
            width: 100%; background: var(--btn); color: var(--text2); border: 1px solid var(--border);
            padding: 12px; font-size: 14px; margin-bottom: 8px; outline: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .results-search::placeholder { color: var(--placeholder); }
        .results-search:focus { border-color: var(--accent-btn); }
        .results-row { display: flex; gap: 8px; align-items: stretch; }
        .results-textarea {
            flex: 1; height: 140px; background: var(--bg4); border: 1px solid var(--border3);
            color: var(--text4); padding: 10px; font-size: 13px; font-family: monospace; resize: vertical; outline: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .results-textarea::placeholder { color: var(--placeholder); }
        .results-textarea:focus { border-color: var(--accent-btn); }

        .stats-grid { display: flex; flex-direction: column; gap: 10px; }
        .stats-card-row {
            background: var(--btn); padding: 10px; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
            transition: background-color 0.3s ease;
        }
        .stats-label { font-size: 13px; color: var(--text3); display: flex; align-items: center; gap: 8px; }
        .stats-value { font-size: 16px; font-weight: bold; color: var(--stats-value-color); }
        .dns-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .dns-badge { background: var(--bg3); padding: 4px 10px; font-size: 11px; }

        .fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 997;
            background: var(--bg); padding: 40px 20px; display: none; flex-direction: column;
            transition: background-color 0.4s ease;
        }
        .fullscreen-overlay.show { display: flex; }
        .fullscreen-overlay textarea { flex: 1; background: var(--bg4); border: 1px solid var(--border3); padding: 15px; font-size: 14px; font-family: monospace; resize: none; }
        .fullscreen-close { position: absolute; top: 10px; right: 20px; background: var(--accent-btn); color: #fff; padding: 8px 16px; cursor: pointer; transition: background-color 0.3s ease; }
        .fullscreen-close:hover { background: var(--accent-btn2); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 998; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--bg2); border: 1px solid var(--border); padding: 20px; max-width: 350px; width: 90%; display: flex; flex-direction: column; gap: 10px; transition: background-color 0.4s ease, border-color 0.4s ease; }
        .modal-box button { background: var(--btn); padding: 10px; cursor: pointer; transition: background-color 0.3s ease, color 0.3s ease; }
        .modal-box button:hover { background: var(--accent-btn); color: #fff; }
        .dns-grid, .view-grid { display: flex; flex-direction: column; gap: 8px; }
        .dns-grid label, .view-grid label { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--btn); cursor: pointer; transition: background-color 0.3s ease; }
        .drop-box { background: var(--bg2); border: 2px dashed var(--accent-btn); padding: 40px; text-align: center; cursor: pointer; transition: background-color 0.3s ease, border-color 0.3s ease; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent-btn); color: #fff; padding: 8px 20px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .toast.show { opacity: 1; }
        .easter-egg { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); 
            background: var(--accent-btn); color: #fff; padding: 20px 40px; font-size: 24px; font-weight: bold; 
            z-index: 999; text-align: center; pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .easter-egg.show { transform: translate(-50%, -50%) scale(1); }
        .easter-egg .heart { display: inline-block; animation: pulse 0.6s ease-in-out infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }
        input[type="file"] { display: none; }
        
        @media (max-width: 550px) { body { padding: 12px; } .tab-btn { font-size: 12px; padding: 10px 4px; } .stats-value { font-size: 16px; } }
    </style>
</head>
<body>

<div class="easter-egg" id="easterEgg">
    <span data-i18n="easterText">Спасибо за использование</span> <span class="heart">❤️</span>
</div>
<div class="modal-overlay" id="dropOverlay" onclick="hideModal('dropOverlay')">
    <div class="drop-box" id="dropBox" onclick="event.stopPropagation()">
        <span data-i18n="dropText">📂 Перетащите файл сюда или нажмите</span>
        <input type="file" id="dropFileInput" accept="*" onchange="handleFile(this, true)">
    </div>
</div>
<div class="modal-overlay" id="exportMenu" onclick="hideModal('exportMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-weight:bold" data-i18n="exportTitle">📥 Экспорт</div>
        <button onclick="exportFile('txt')">📄 TXT</button>
        <button onclick="exportFile('csv')">📊 CSV</button>
        <button onclick="exportFile('json')">📋 JSON</button>
        <button onclick="exportFile('md')">📝 MD</button>
    </div>
</div>
<div class="modal-overlay" id="dnsMenu" onclick="hideModal('dnsMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-weight:bold" data-i18n="dnsMenuTitle">📡 Выберите DNS серверы</div>
        <div class="dns-grid" id="dnsGrid"></div>
        <button class="dns-done-btn" onclick="hideModal('dnsMenu')" data-i18n="dnsDoneBtn">✅ Готово</button>
    </div>
</div>
<div class="modal-overlay" id="viewMenu" onclick="hideModal('viewMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-weight:bold" data-i18n="viewMenuTitle">👁️ Вид результатов</div>
        <div class="view-grid" id="viewGrid"></div>
        <button class="dns-done-btn" onclick="hideModal('viewMenu')" data-i18n="viewDoneBtn">✅ Готово</button>
    </div>
</div>
<div class="modal-overlay" id="starMenu" onclick="hideModal('starMenu')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="star-text" data-i18n="starText">⭐ Поддержи проект</div>
        <div class="star-links" style="display:flex; gap:8px">
            <a href="https://github.com/Michi-Mochirellune/dns-resolver-michigan" target="_blank" style="flex:1; text-align:center; background:var(--btn); padding:8px; text-decoration:none; color:var(--text2)">⭐ GitHub</a>
            <a href="https://t.me/MichiMochirellune" target="_blank" style="flex:1; text-align:center; background:var(--btn); padding:8px; text-decoration:none; color:var(--text2)">📢 Telegram</a>
        </div>
    </div>
</div>

<div class="fullscreen-overlay" id="fsInput"><button class="fullscreen-close" onclick="closeFS('fsInput')">✕</button><textarea id="fsInputBox"></textarea></div>
<div class="fullscreen-overlay" id="fsResults"><button class="fullscreen-close" onclick="closeFS('fsResults')">✕</button><textarea id="fsResultsBox" readonly></textarea></div>

<div class="container">
    <div class="header">
        <div class="header-left">
            <img class="logo" id="logo" src="https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png" onclick="easterClick()">
            <button class="h-btn star-btn" onclick="showModal('starMenu')">⭐ <span data-i18n="btnSupport">Проект</span></button>
        </div>
        <div class="header-buttons">
            <button class="h-btn preset" onclick="addPreset('telegram.org\nreddit.com\nwikipedia.org\nstackoverflow.com\n')">📋 <span data-i18n="presetBtnShort">Тест</span></button>
            <button class="h-btn" id="themeToggleBtn" onclick="cycleTheme()">🔄 <span data-i18n="btnTheme">Тема</span></button>
            <button class="h-btn lang" id="langToggleBtn" onclick="toggleLanguage()"><span id="langIcon">🇷🇺</span> <span id="langCode">RU</span></button>
            <button class="h-btn" id="settingsToggleBtn" onclick="toggleSettings()"><span id="settingsIcon">⚙️</span> <span data-i18n="btnSettings">Настройки</span></button>
        </div>
        <div class="settings-box" id="settingsBox">
            <button class="dns-select-btn" onclick="showDNSMenu()" data-i18n-format="dnsSelectBtn" data-format-param="1">📡 Выбрать DNS серверы (1)</button>
            <button class="view-select-btn" onclick="showViewMenu()" data-i18n="viewSelectBtn">👁️ Вид результатов</button>
            <div class="settings-row">
                <div class="settings-item"><div class="settings-label" data-i18n="typeLabel">📝 Тип записи</div>
                    <select id="recordType" onchange="setRecordType(this.value)">
                        <option value="A">🌐 A (IPv4)</option><option value="AAAA">🌍 AAAA (IPv6)</option>
                        <option value="MX">📧 MX</option><option value="NS">🗄️ NS</option><option value="SOA">📋 SOA</option>
                        <option value="TXT">📝 TXT</option><option value="CNAME">🔗 CNAME</option>
                        <option value="CAA">🔒 CAA</option><option value="PTR">↩️ PTR</option>
                    </select>
                </div>
                <div class="settings-item"><div class="settings-label" data-i18n="timeoutLabel">⏰ Таймаут</div>
                    <select id="timeoutSelect" onchange="setTimeoutVal(parseInt(this.value))">
                        <option value="5" data-i18n-options="timeoutOptions.0">5 сек</option>
                        <option value="10" data-i18n-options="timeoutOptions.1">10 сек</option>
                        <option value="15" data-i18n-options="timeoutOptions.2">15 сек</option>
                    </select>
                </div>
                <div class="settings-item"><div class="settings-label" data-i18n="delayLabel">🐌 Задержка</div>
                    <select id="delaySelect" onchange="setDelay(parseInt(this.value))">
                        <option value="0" data-i18n-options="delayOptions.0">Без задержки</option>
                        <option value="500" data-i18n-options="delayOptions.1">0.5 сек</option>
                        <option value="1000" data-i18n-options="delayOptions.2">1 сек</option>
                    </select>
                </div>
            </div>
            <button class="tgl-btn" id="formatBtn" onclick="toggleFormat()" data-i18n-format="formatBtn" data-format-param="onlyip">🔢 Формат: Only IP</button>
        </div>
    </div>

function t(key, ...args) {
    const val = L[currentLanguage] && L[currentLanguage][key];
    if (typeof val === 'function') {
        return val(...args);
    }
    return val !== undefined ? val : key;
}

function applyI18N() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = L[currentLanguage] && L[currentLanguage][key];
        if (val !== undefined && typeof val !== 'function') {
            el.textContent = val;
        }
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        const val = L[currentLanguage] && L[currentLanguage][key];
        if (val !== undefined && typeof val !== 'function') {
            el.setAttribute('placeholder', val);
        }
    });

    document.querySelectorAll('[data-i18n-format]').forEach(el => {
        const key   = el.getAttribute('data-i18n-format');
        const param = el.getAttribute('data-format-param');
        const fn    = L[currentLanguage] && L[currentLanguage][key];
        if (typeof fn === 'function') {
            el.textContent = fn(param);
        }
    });

    document.querySelectorAll('[data-i18n-options]').forEach(el => {
        const parts = el.getAttribute('data-i18n-options').split('.');
        const key   = parts[0];
        const idx   = parseInt(parts[1], 10);
        const arr   = L[currentLanguage] && L[currentLanguage][key];
        if (Array.isArray(arr) && arr[idx] !== undefined) {
            el.textContent = arr[idx];
        }
    });

    updateLangButton();
    updateRecordTypeOptions();
    updateFilterButtonText();
    updateStatsTab();
    updateSettingsButton();
}

function updateLangButton() {
    const icon = document.getElementById('langIcon');
    const code = document.getElementById('langCode');
    if (currentLanguage === 'ru') {
        if (icon) icon.textContent = '🇷🇺';
        if (code) code.textContent = 'RU';
    } else {
        if (icon) icon.textContent = '🇬🇧';
        if (code) code.textContent = 'EN';
    }
}

function updateSettingsButton() {
    const icon = document.getElementById('settingsIcon');
    const box = document.getElementById('settingsBox');
    if (icon) {
        icon.textContent = (box.style.display === 'flex') ? t('settingsOpen') : t('settingsClosed');
    }
}

function updateRecordTypeOptions() {
    const labels = {
        MX:    '📧 MX (' + t('mxLabel') + ')',
        NS:    '🗄️ NS (' + t('nsLabel') + ')',
        SOA:   '📋 SOA (' + t('soaLabel') + ')',
        TXT:   '📝 TXT (' + t('txtLabel') + ')',
        CNAME: '🔗 CNAME (' + t('cnameLabel') + ')',
        CAA:   '🔒 CAA (' + t('caaLabel') + ')',
        PTR:   '↩️ PTR (' + t('ptrLabel') + ')'
    };
    const sel = document.getElementById('recordType');
    if (!sel) return;
    for (let i = 0; i < sel.options.length; i++) {
        const opt = sel.options[i];
        if (labels[opt.value]) {
            opt.textContent = labels[opt.value];
        }
    }
}

function updateFilterButtonText() {
    const btn = document.getElementById('filterBtn');
    if (!btn) return;
    const texts = {
        all: t('filterBtn'),
        success: '✅ ' + (currentLanguage === 'ru' ? 'Успешные' : 'Success'),
        errors: '❌ ' + (currentLanguage === 'ru' ? 'Ошибки' : 'Errors')
    };
    btn.textContent = texts[filterMode] || texts.all;
}

function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) {
        el = document.createElement('div');
        el.className = 'toast';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

function applyTheme() {
    document.body.classList.remove('light', 'xp');
    if (themeMode === 'system') {
        if (window.matchMedia('(prefers-color-scheme: light)').matches) document.body.classList.add('light');
    } else if (themeMode === 'light') {
        document.body.classList.add('light');
    } else if (themeMode === 'xp') {
        document.body.classList.add('xp');
    }
    const icons = { system: '🔄', light: '☀️', xp: 'XP', dark: '🌙' };
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = (icons[themeMode] || '🌙') + ' <span data-i18n="btnTheme">' + t('btnTheme') + '</span>';
    }
    const logos = {
        light: 'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logow.png',
        xp:    'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logoxp.png'
    };
    const logo = document.getElementById('logo');
    if (logo) {
        logo.src = logos[themeMode] || 'https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png';
    }
}

function cycleTheme() {
    const order = ['system', 'light', 'xp', 'dark'];
    themeMode = order[(order.indexOf(themeMode) + 1) % order.length];
    applyTheme();
    try { localStorage.setItem('dnsresolver_theme', themeMode); } catch(e) {}
}

window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (themeMode === 'system') applyTheme();
});

function toggleLanguage() {
    currentLanguage = currentLanguage === 'ru' ? 'en' : 'ru';
    applyI18N();
    updateLineCounter();
    updateProviderFilter();
    try { localStorage.setItem('dnsresolver_lang', currentLanguage); } catch(e) {}
}

function detectInitialLanguage() {
    try {
        const saved = localStorage.getItem('dnsresolver_lang');
        if (saved === 'ru' || saved === 'en') {
            currentLanguage = saved;
            return;
        }
        const nav = (navigator.language || 'en').toLowerCase();
        currentLanguage = nav.startsWith('ru') ? 'ru' : 'en';
    } catch(e) {
        currentLanguage = 'en';
    }
}

document.getElementById('tabStatsBtn').addEventListener('click', () => {
    switchTab('stats');
    updateStatsTab();
});

function switchTab(tab) {
    document.getElementById('tabResults').classList.toggle('active', tab === 'results');
    document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
    document.getElementById('tabResultsBtn').classList.toggle('active', tab === 'results');
    document.getElementById('tabStatsBtn').classList.toggle('active', tab === 'stats');
}

function updateLineCounter() {
    const lines = document.getElementById('inputDomains').value.split('\n').map(l => l.trim()).filter(l => l.length);
    const counter = document.getElementById('lineCounter');
    if (!lines.length) {
        counter.textContent = '';
        counter.classList.remove('has-content');
        return;
    }
    const unique = new Set(lines.map(l => l.toLowerCase())).size;
    const dupes = lines.length - unique;
    const loc = currentLanguage === 'ru'
        ? { lines: 'Строк', unique: 'Уникальные IP', dupes: 'Дублей' }
        : { lines: 'Lines', unique: 'Unique IPs', dupes: 'Dupes' };
    let label = `📊 ${loc.lines}: ${lines.length} | ✨ ${loc.unique}: ${unique}`;
    if (dupes > 0) label += ` | 🔁 ${loc.dupes}: ${dupes}`;
    counter.textContent = label;
    counter.classList.add('has-content');
}

function filterInputDomains() {
    const q = document.getElementById('inputSearch').value.toLowerCase();
    const ta = document.getElementById('inputDomains');
    const src = allInputDomains || ta.value;
    if (!q.trim()) {
        ta.value = src;
        updateLineCounter();
        return;
    }
    ta.value = src.split('\n').filter(l => l.toLowerCase().includes(q)).join('\n');
    updateLineCounter();
}

function addPreset(text) {
    document.getElementById('inputDomains').value = text;
    allInputDomains = text;
    updateLineCounter();
    toast(t('presetAdded'));
}

function dedupDomains() {
    const ta = document.getElementById('inputDomains');
    const lines = ta.value.split('\n').map(l => l.trim()).filter(l => l.length);
    const seen = new Set();
    const uniq = [];
    for (const l of lines) {
        const low = l.toLowerCase();
        if (!seen.has(low)) {
            seen.add(low);
            uniq.push(l);
        }
    }
    if (lines.length === uniq.length) {
        toast(t('noDupesFound'));
        return;
    }
    ta.value = uniq.join('\n');
    allInputDomains = ta.value;
    updateLineCounter();
    toast(t('dupsRemoved'));
}

function clearInputOnly() {
    document.getElementById('inputDomains').value = '';
    document.getElementById('inputSearch').value = '';
    allInputDomains = '';
    updateLineCounter();
    toast(t('cleared'));
}

function copyTextarea(id) {
    const text = document.getElementById(id).value;
    if (!text.trim()) {
        toast(t('emptyToast'));
        return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(() => toast(t('copied')))
            .catch(() => fallbackCopy(id));
    } else {
        fallbackCopy(id);
    }
}

function fallbackCopy(id) {
    const ta = document.getElementById(id);
    ta.select();
    ta.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        toast(t('copied'));
    } catch (e) {
        toast(t('copyFail'));
    }
    ta.blur();
}

function openFS(overlayId, sourceId, targetId) {
    document.getElementById(targetId).value = document.getElementById(sourceId).value;
    document.getElementById(overlayId).classList.add('show');
}

function closeFS(id) {
    document.getElementById(id).classList.remove('show');
}

function showModal(id) {
    document.getElementById(id).classList.add('show');
}

function hideModal(id) {
    document.getElementById(id).classList.remove('show');
}

function toggleSettings() {
    const box = document.getElementById('settingsBox');
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    updateSettingsButton();
}

function setRecordType(val) {
    recordType = val;
}

function setTimeoutVal(s) {
    timeout = s * 1000;
}

function setDelay(d) {
    delay = d;
}

function toggleFormat() {
    outputFormat = outputFormat === 'hosts' ? 'onlyip' : 'hosts';
    document.getElementById('formatBtn').setAttribute('data-format-param', outputFormat);
    document.getElementById('formatBtn').textContent = t('formatBtn', outputFormat);
    if (currentResults.length) applyAllFilters();
}

function showDNSMenu() {
    const grid = document.getElementById('dnsGrid');
    grid.innerHTML = Object.keys(allDNSServers).map(k => {
        const s = allDNSServers[k];
        const checked = activeServers.includes(k) ? 'checked' : '';
        return `<label><input type="checkbox" value="${k}" ${checked} onchange="toggleServer('${k}', this.checked)">${s.name}</label>`;
    }).join('');
    showModal('dnsMenu');
}

function toggleServer(key, checked) {
    if (checked) {
        if (!activeServers.includes(key)) activeServers.push(key);
    } else {
        activeServers = activeServers.filter(k => k !== key);
    }
    const btn = document.querySelector('.dns-select-btn');
    if (btn) {
        btn.setAttribute('data-format-param', activeServers.length);
        btn.textContent = t('dnsSelectBtn', activeServers.length);
    }
    updateProviderFilter();
}

function showViewMenu() {
    const grid = document.getElementById('viewGrid');
    grid.innerHTML = [
        `<label><input type="checkbox" ${showDNSNames ? 'checked' : ''} onchange="setShowDNSNames(this.checked)">${t('showDNSNamesLabel')}</label>`,
        `<label><input type="checkbox" ${showSep ? 'checked' : ''} onchange="setShowSep(this.checked)">${t('showSepLabel')}</label>`,
        `<label><input type="checkbox" ${showTTL ? 'checked' : ''} onchange="setShowTTL(this.checked)">${t('showTTLLabel')}</label>`,
        `<label><input type="checkbox" ${showSpeed ? 'checked' : ''} onchange="setShowSpeed(this.checked)">${t('showSpeedLabel')}</label>`
    ].join('');
    showModal('viewMenu');
}

function setShowTTL(v)      { showTTL = v;      if (currentResults.length) applyAllFilters(); }
function setShowDNSNames(v) { showDNSNames = v; if (currentResults.length) applyAllFilters(); }
function setShowSep(v)      { showSep = v;      if (currentResults.length) applyAllFilters(); }
function setShowSpeed(v)    { showSpeed = v;    if (currentResults.length) applyAllFilters(); }

function updateProviderFilter() {
    const sel = document.getElementById('providerFilter');
    while (sel.options.length > 1) sel.remove(1);
    for (const s of activeServers) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = allDNSServers[s]?.name || s;
        sel.appendChild(opt);
    }
    sel.options[0].textContent = t('providerAll');
}

function cycleFilter() {
    const order = ['all', 'success', 'errors'];
    filterMode = order[(order.indexOf(filterMode) + 1) % order.length];
    updateFilterButtonText();
    if (currentResults.length) applyAllFilters();
}

function applyAllFilters() {
    if (!currentResults.length) {
        document.getElementById('resultsBox').value = '';
        return;
    }
    let filtered = [...currentResults];
    if (filterMode === 'success') {
        filtered = filtered.filter(r => !r.error);
    } else if (filterMode === 'errors') {
        filtered = filtered.filter(r => r.error);
    }
    const provider = document.getElementById('providerFilter').value;
    if (provider !== 'all') {
        filtered = filtered.filter(r => r.server === provider);
    }
    const q = document.getElementById('resultsSearch').value.toLowerCase();
    if (q.trim()) {
        filtered = filtered.filter(r =>
            r.domain.toLowerCase().includes(q) ||
            (r.ip || '').toLowerCase().includes(q)
        );
    }
    displayResults(filtered);
}

function displayResults(results) {
    const lines = [];
    for (let i = 0; i < results.length; i++) {
        const r = results[i];
        if (r.error) {
            lines.push(`❌ ${r.domain}`);
        } else {
            let extras = '';
            if (showTTL && r.ttl) extras += ` | TTL: ${r.ttl}s`;
            if (showSpeed && r.responseTime) extras += ` | ${r.responseTime} ms`;
            const prefix = (showDNSNames && r.server && allDNSServers[r.server])
                ? allDNSServers[r.server].short + ': '
                : '';
            lines.push(outputFormat === 'hosts'
                ? `${prefix}${r.ip} ${r.domain}${extras}`
                : `${prefix}${r.ip}${extras}`
            );
        }
        if (showSep && i < results.length - 1) lines.push('');
    }
    document.getElementById('resultsBox').value = lines.join('\n');
}

function dedupResults() {
    if (!currentResults.length) {
        toast(t('noDupesFound'));
        return;
    }
    const seen = new Set();
    const newRes = [];
    for (const r of currentResults) {
        if (r.error) {
            newRes.push(r);
            continue;
        }
        if (!seen.has(r.ip)) {
            seen.add(r.ip);
            newRes.push(r);
        }
    }
    if (newRes.length === currentResults.length) {
        toast(t('noDupesFound'));
        return;
    }
    currentResults = newRes;
    applyAllFilters();
    toast(t('dupsRemoved'));
}

function clearResultsOnly() {
    document.getElementById('resultsBox').value = '';
    currentResults = [];
    resolveStartTime = 0;
    lastRttStr = '';
    statsData = {
        found: 0,
        errors: 0,
        total: 0,
        unique: 0,
        dupes: 0,
        responseTimes: [],
        servers: [],
        ttlAvg: 0
    };
    toast(t('cleared'));
    updateStatsTab();
}

function exportFile(format) {
    if (!currentResults.length) {
        toast(t('emptyToast'));
        return;
    }
    let content = '';
    let ext = 'txt';
    let mime = 'text/plain';

    if (format === 'csv') {
        content = ['Domain,IP,Status', ...currentResults.map(r => `${r.domain},${r.ip || ''},${r.error ? 'Error' : 'OK'}`)].join('\n');
        ext = 'csv';
        mime = 'text/csv';
    } else if (format === 'json') {
        content = JSON.stringify(currentResults.map(r => ({
            domain: r.domain,
            ip: r.ip || null,
            error: r.error
        })), null, 2);
        ext = 'json';
        mime = 'application/json';
    } else if (format === 'md') {
        content = [
            '| Domain | IP | Status |',
            '|:---|:---|:---|',
            ...currentResults.map(r => `| ${r.domain} | ${r.ip || '-'} | ${r.error ? '❌' : '✅'} |`)
        ].join('\n');
        ext = 'md';
        mime = 'text/markdown';
    } else {
        content = document.getElementById('resultsBox').value || '';
    }

    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: `dns-results.${ext}` });
    a.click();
    URL.revokeObjectURL(url);
    toast(t('exported'));
}

function handleFile(input, isDrop) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        document.getElementById('inputDomains').value = e.target.result;
        allInputDomains = e.target.result;
        updateLineCounter();
        if (isDrop) hideModal('dropOverlay');
        toast(t('imported'));
    };
    reader.onerror = () => toast(t('copyFail'));
    reader.readAsText(file);
    input.value = '';
}

document.getElementById('dropBox').addEventListener('click', () => document.getElementById('dropFileInput').click());
document.getElementById('dropBox').addEventListener('dragover', e => {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
});
document.getElementById('dropBox').addEventListener('dragleave', e => {
    e.currentTarget.classList.remove('drag-over');
});
document.getElementById('dropBox').addEventListener('drop', e => {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) {
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('dropFileInput').files = dt.files;
        handleFile(document.getElementById('dropFileInput'), true);
    }
});

async function resolveSingle(domain, serverKey, type, signal, attempt = 0) {
    const start = Date.now();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    const onAbort = () => ctrl.abort();
    if (signal) signal.addEventListener('abort', onAbort);

    try {
        const url = allDNSServers[serverKey]?.url;
        const res = await fetch(`${url}?name=${encodeURIComponent(domain)}&type=${type}`, {
            headers: { Accept: 'application/dns-json' },
            signal: ctrl.signal
        });
        clearTimeout(timer);
        if (signal) signal.removeEventListener('abort', onAbort);

        const data = await res.json();
        let result = null;
        let ttl = null;

        if (data.Answer?.length) {
            const rec = data.Answer.find(r => r.type === recordTypes[type]);
            if (rec) {
                result = rec.data;
                ttl = rec.TTL;
            }
        }

        return {
            result,
            ttl,
            size: JSON.stringify(data).length,
            responseTime: Date.now() - start
        };
    } catch(e) {
        clearTimeout(timer);
        if (signal) signal.removeEventListener('abort', onAbort);

        if (attempt < 2 && !signal?.aborted) {
            await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
            return resolveSingle(domain, serverKey, type, signal, attempt + 1);
        }
        return { error: true, responseTime: Date.now() - start };
    }
}

async function startResolving() {
    if (!activeServers.length) {
        document.getElementById('inputDomains').value = '';
        document.getElementById('inputSearch').value = '';
        allInputDomains = '';
        updateLineCounter();
        
        currentResults = [];
        statsData = {
            found: 0,
            errors: 0,
            total: 0,
            unique: 0,
            dupes: 0,
            responseTimes: [],
            servers: [],
            ttlAvg: 0
        };
        
        document.getElementById('resultsBox').value = t('noServers');
        updateStatsTab();
        switchTab('results');
        
        return;
    }

    let rawText = document.getElementById('inputDomains').value
        .replace(/https?:\/\//g, '')
        .replace(/\/.*/g, '');
    const domains = rawText.split('\n').map(l => l.trim()).filter(l => l.length);

    if (!domains.length) {
        toast(t('noDomainsToast'));
        return;
    }

    const valid = domains.filter(d => /^[a-zA-Z0-9._\-]+$/.test(d));
    if (!valid.length) {
        toast(t('noDomainsToast'));
        return;
    }

    allInputDomains = document.getElementById('inputDomains').value;

    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    document.getElementById('progressBar').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';
    currentResults = [];
    resolveStartTime = Date.now();

    toast(t('started'));

    abortController = new AbortController();
    const signal = abortController.signal;

    let found = 0;
    let errors = 0;
    let totalSize = 0;
    const allRtt = [];

    const BATCH_SIZE = 5;

    for (let i = 0; i < valid.length; i += BATCH_SIZE) {
        if (signal.aborted) break;

        const batch = valid.slice(i, i + BATCH_SIZE);
        const batchRes = await Promise.all(
            batch.map(domain =>
                Promise.all(activeServers.map(s => resolveSingle(domain, s, recordType, signal)))
                    .then(results => ({ domain, results }))
            )
        );

        for (const { domain, results } of batchRes) {
            if (signal.aborted) break;
            for (let j = 0; j < results.length; j++) {
                const r = results[j];
                const s = activeServers[j];
                if (r?.result) {
                    found++;
                    totalSize += r.size;
                    if (r.responseTime) allRtt.push(r.responseTime);
                    currentResults.push({
                        domain,
                        ip: r.result,
                        error: false,
                        ttl: r.ttl,
                        server: s,
                        responseTime: r.responseTime
                    });
                } else {
                    errors++;
                    currentResults.push({
                        domain,
                        ip: null,
                        error: true,
                        server: s
                    });
                }
            }
        }

        const progress = Math.min(i + BATCH_SIZE, valid.length);
        document.getElementById('progressFill').style.width = `${(progress / valid.length) * 100}%`;

        if (delay > 0 && i + BATCH_SIZE < valid.length && !signal.aborted) {
            await new Promise(r => setTimeout(r, delay));
        }
    }

    applyAllFilters();

    lastElapsed = ((Date.now() - resolveStartTime) / 1000).toFixed(1);
    lastSizeKB = (totalSize / 1024).toFixed(1);

    if (allRtt.length) {
        const min = Math.min(...allRtt);
        const max = Math.max(...allRtt);
        const avg = Math.round(allRtt.reduce((a, b) => a + b, 0) / allRtt.length);
        lastRttStr = t('rtt', min, avg, max);
    } else {
        lastRttStr = '';
    }

    const uniqueIpsFinal = new Set(currentResults.filter(r => !r.error && r.ip).map(r => r.ip));
    statsData = {
        found,
        errors,
        total: currentResults.length,
        unique: uniqueIpsFinal.size,
        dupes: found - uniqueIpsFinal.size,
        responseTimes: allRtt,
        servers: [...activeServers],
        ttlAvg: currentResults.filter(r => r.ttl).length
            ? Math.round(currentResults.filter(r => r.ttl).reduce((a, b) => a + b.ttl, 0) / currentResults.filter(r => r.ttl).length)
            : 0
    };

    updateStatsTab();
    stopResolving();
}

function stopResolving() {
    if (abortController) {
        abortController.abort();
        abortController = null;
    }
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('progressBar').style.display = 'none';
}

function updateStatsTab() {
    const grid = document.getElementById('statsGrid');
    if (!grid) return;

    const r = statsData.responseTimes || [];

    let html = '';

    html += `<div class="stats-card-row"><div class="stats-label">${t('statTotal')}</div><div class="stats-value">${statsData.total}</div></div>`;
    html += `<div class="stats-card-row"><div class="stats-label">${t('statFound')}</div><div class="stats-value">${statsData.found}</div></div>`;
    html += `<div class="stats-card-row"><div class="stats-label">${t('statErrors')}</div><div class="stats-value">${statsData.errors}</div></div>`;
    html += `<div class="stats-card-row"><div class="stats-label">${t('statUnique')}</div><div class="stats-value">${statsData.unique}</div></div>`;
    html += `<div class="stats-card-row"><div class="stats-label">${t('statDupes')}</div><div class="stats-value">${statsData.dupes}</div></div>`;

    if (r.length) {
        const minRtt = Math.min(...r);
        const maxRtt = Math.max(...r);
        const avgRtt = Math.round(r.reduce((a, b) => a + b, 0) / r.length);
        html += `<div class="stats-card-row"><div class="stats-label">${t('statRtt')}</div><div class="stats-value">${minRtt}/${avgRtt}/${maxRtt} ${t('ms')}</div></div>`;
    }

    html += `<div class="stats-card-row"><div class="stats-label">${t('statTime')}</div><div class="stats-value">${lastElapsed} ${t('sec')}</div></div>`;
    html += `<div class="stats-card-row"><div class="stats-label">${t('statSize')}</div><div class="stats-value">${lastSizeKB} ${t('kb')}</div></div>`;
    html += `<div class="stats-card-row"><div class="stats-label">${t('statTtl')}</div><div class="stats-value">${statsData.ttlAvg} ${t('ms')}</div></div>`;

    html += `<div class="stats-card-row"><div class="stats-label">${t('statServers')}</div><div class="stats-value"><div class="dns-list">`;
    for (const s of (statsData.servers || [])) {
        html += `<span class="dns-badge">${allDNSServers[s]?.name || s}</span>`;
    }
    html += `</div></div></div>`;

    grid.innerHTML = html;
}

function easterClick() {
    easterClicks++;
    if (easterClicks >= 3) {
        const egg = document.getElementById('easterEgg');
        egg.querySelector('span').textContent = t('easterText');
        egg.classList.add('show');
        setTimeout(() => egg.classList.remove('show'), 2500);
        easterClicks = 0;
    }
}

document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (document.getElementById('startBtn').style.display !== 'none') startResolving();
    }
    if (e.key === 'Escape') {
        const openModal = document.querySelector('.modal-overlay.show, .fullscreen-overlay.show');
        if (openModal) {
            openModal.classList.remove('show');
            return;
        }
        if (abortController) stopResolving();
    }
});

    const saved = localStorage.getItem('dnsresolver_theme');
    if (['system', 'light', 'dark', 'xp'].includes(saved)) themeMode = saved;
} catch(e) {}

applyTheme();
applyI18N();
