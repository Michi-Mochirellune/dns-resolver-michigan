<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dns resolver Michigan</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        button,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;margin:0;padding:0;border:none;background:none;color:inherit;-webkit-appearance:none;-moz-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0b0712;--bg2:#160f24;--bg3:#1f142e;--bg4:#130c1f;--text:#e6dbff;--text2:#bfa6ff;--text3:#9980b3;--text4:#d4c7e8;--border:#321f4d;--border2:#442a66;--border3:#281840;--btn:#251a3a;--btn2:#402666;--btn3:#2d1a4a;--accent:#d4a8ff;--accent2:#e0c4ff;--accent-btn:#782ec7;--accent-btn2:#8c3be0;--green:#1a6b3c;--green2:#2ecc71;--input:#1f142e;--input-text:#e6e1ff;--placeholder:#665980;--dev-bg:#1a1130;--dev-border:#3d2760;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bg.jpg');--overlay:rgba(11,7,18,0.6);--preset-bg:#2c8c3c;--preset-text:#fff;--preset-hover:#1e7a45;--shadow:rgba(212,168,255,0.3);--clear-hover:#c0392b;--toggle-active-text:#fff;--hover-text:#fff;--active-border:#9445ff;--settings-active-bg:#402666;--tooltip-bg:#251a3a;--tooltip-text:#bfa6ff;--progress-bg:#251a3a;--progress-fill:#782ec7;--logo-url:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png');--theme-icon:'🌙'
        }
        .light{--bg:#fefefe;--bg2:#f5f5f5;--bg3:#eee;--bg4:#f5f5f5;--text:#333;--text2:#555;--text3:#939394;--text4:#444;--border:#ddd;--border2:#ccc;--border3:#ddd;--btn:#f0f0f0;--btn2:#e8e8e8;--btn3:#eee;--accent:#666;--accent2:#777;--accent-btn:#888;--accent-btn2:#999;--green:#1a6b3c;--green2:#2ecc71;--input:#f5f5f5;--input-text:#333;--placeholder:#aaa;--dev-bg:#f0f0f0;--dev-border:#ddd;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgw.jpg');--overlay:rgba(254,254,254,0.7);--preset-bg:#2c8c3c;--preset-text:#fff;--preset-hover:#1e7a45;--shadow:rgba(0,0,0,0.1);--clear-hover:#c0392b;--toggle-active-text:#333;--hover-text:#333;--active-border:#aaa;--settings-active-bg:#d5d5d5;--tooltip-bg:#e8e8e8;--tooltip-text:#555;--progress-bg:#e0e0e0;--progress-fill:#888;--logo-url:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logow.png');--theme-icon:'☀️'}
        .xp{--bg:#3881f4;--bg2:#2360c4;--bg3:#1a4ab0;--bg4:#1a3a6a;--text:#ffffff;--text2:#ffffff;--text3:#e0e8ff;--text4:#ffffff;--border:#5a9af5;--border2:#4a8ae5;--border3:#3a7ad5;--btn:#2d6cd4;--btn2:#2360c4;--btn3:#1a4ab0;--accent:#6aafff;--accent2:#8ac0ff;--accent-btn:#4a8ae5;--accent-btn2:#3a7ad5;--green:#2c8c3c;--green2:#1e7a45;--input:#2360c4;--input-text:#ffffff;--placeholder:#a0c8ff;--dev-bg:#2d6cd4;--dev-border:#5a9af5;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgxp.png');--overlay:rgba(0,0,0,0.1);--preset-bg:#2c8c3c;--preset-text:#ffffff;--preset-hover:#1e7a45;--shadow:rgba(0,0,0,0.3);--clear-hover:#c0392b;--toggle-active-text:#ffffff;--hover-text:#ffffff;--active-border:#6aafff;--settings-active-bg:#1a4ab0;--tooltip-bg:#1a4ab0;--tooltip-text:#e0e8ff;--progress-bg:#1a4ab0;--progress-fill:#6aafff;--logo-url:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logoxp.png');--theme-icon:'XP'}
        *{transition:all 0.2s ease}
        body{background-color:var(--bg);background-image:var(--bg-img);background-size:cover;background-position:center;background-attachment:scroll;color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh;position:relative}
        body::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background-color:var(--overlay);z-index:0}
        .container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
        .header{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:3px;flex-wrap:wrap;gap:6px}
        .header-left{display:flex;align-items:center;gap:8px}
        .logo{height:50px;cursor:pointer;user-select:none}
        .logo:hover{filter:drop-shadow(0 0 8px var(--shadow))}
        .header-buttons{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
        .h-btn{background-color:var(--btn2);color:var(--text2);border:none;padding:8px 10px;border-radius:0px;cursor:pointer;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
        .h-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .h-btn.active{background-color:var(--settings-active-bg)}
        .h-btn.lang{background-color:var(--btn3)}
        .h-btn.preset{background-color:var(--preset-bg);color:var(--preset-text)}
        .h-btn.preset:hover{background-color:var(--preset-hover);color:#fff}
        .h-btn.star-btn{background-color:var(--accent-btn);color:#fff;font-size:16px;padding:8px 12px}
        .h-btn.star-btn:hover{background-color:var(--accent-btn2);transform:scale(1.05)}
        .settings-box{background-color:var(--bg2);border-radius:0px;padding:14px;display:none;flex-direction:column;gap:10px;border:1px solid var(--border)}
        .s-label{font-size:14px;color:var(--text3);display:flex;align-items:center;gap:4px}
        .btn-group{display:flex;gap:6px;flex-wrap:wrap}
        .tgl-btn{flex:1;min-width:60px;background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:8px 6px;font-size:12px;border-radius:0px;cursor:pointer;text-align:center;display:inline-flex;align-items:center;justify-content:center}
        .tgl-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .tgl-btn.active{background-color:var(--accent-btn);color:var(--toggle-active-text);border-color:var(--active-border);box-shadow:0 0 8px var(--shadow)}
        .dns-select-btn{background:var(--accent-btn);color:#fff;border:none;padding:10px;border-radius:0px;cursor:pointer;font-size:14px;width:100%;text-align:center;display:inline-flex;align-items:center;justify-content:center}
        .dns-select-btn:hover{background:var(--accent-btn2)}
        .view-select-btn{background:var(--btn);color:var(--text2);border:none;padding:10px;border-radius:0px;cursor:pointer;font-size:14px;width:100%;text-align:center;display:inline-flex;align-items:center;justify-content:center}
        .view-select-btn:hover{background:var(--accent-btn);color:#fff}
        .settings-row{display:flex;gap:8px;align-items:stretch;width:100%}
        .settings-row select{flex:1;min-width:0;background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:10px 6px;border-radius:0px;font-size:13px;cursor:pointer}
        .settings-row select:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .settings-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
        .settings-label{font-size:14px;color:var(--text3);text-align:center;min-height:14px;line-height:1.2}
        textarea{width:100%;height:160px;background-color:var(--input);color:var(--input-text);border:1px solid var(--border2);border-radius:0px;padding:10px;font-size:15px;box-sizing:border-box;resize:vertical;outline:none}
        textarea::placeholder{color:var(--placeholder)}
        textarea:focus{border-color:var(--accent-btn);box-shadow:0 0 10px var(--shadow)}
        .input-row,.results-row{display:flex;gap:4px;align-items:stretch}
        .side-btns{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
        .side-btn{background-color:var(--btn2);color:var(--text2);border:none;padding:6px 8px;border-radius:0px;cursor:pointer;font-size:14px;flex:1;display:flex;align-items:center;justify-content:center}
        .side-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .side-btn.danger:hover{background-color:var(--clear-hover);color:#fff}
        .main-btn{color:#fff;border:none;border-radius:0px;padding:14px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 0 15px var(--shadow);display:inline-flex;align-items:center;justify-content:center}
        .main-btn.start{background-color:var(--accent-btn);width:100%}
        .main-btn.start:hover{background-color:var(--accent-btn2)}
        .main-btn.stop{background-color:#c0392b;display:none}
        .main-btn.stop:hover{background-color:#e74c3c}
        .main-btn:disabled{opacity:0.5;cursor:not-allowed}
        .progress-bar{display:none;height:6px;background:var(--progress-bg);border-radius:0px;overflow:hidden}
        .progress-fill{height:100%;background:var(--progress-fill);border-radius:0px;width:0%}
        .dns-indicator,.stats,.time-info{color:var(--text3);font-size:12px;text-align:center;min-height:14px}
        .stats{font-size:13px}
        .line-counter{color:var(--text3);font-size:11px;text-align:right;min-height:12px}
        .search-row{display:flex;gap:4px;align-items:center}
        .search-input{flex:1;background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:6px 8px;border-radius:0px;font-size:12px;outline:none}
        .search-input::placeholder{color:var(--placeholder)}
        .search-input:focus{border-color:var(--accent-btn)}
        .results-container{display:none;flex-direction:column;gap:6px;margin-top:2px}
        .results-header{display:flex;justify-content:flex-start;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:2px}
        .results-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
        .a-btn{background-color:var(--btn3);color:var(--text2);border:1px solid var(--border);padding:7px 12px;border-radius:0px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
        .a-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .a-btn.toggled{background-color:var(--accent-btn);color:#fff}
        .results-textarea{width:100%;height:160px;background-color:var(--bg4);border:1px solid var(--border3);color:var(--text4);border-radius:0px;padding:10px;font-size:15px;box-sizing:border-box;resize:vertical;outline:none;font-family:monospace}
        .results-textarea:focus{border-color:var(--accent-btn);box-shadow:0 0 10px var(--shadow)}
        .fullscreen-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:997;background:var(--bg);padding:40px 20px;box-sizing:border-box;display:none;flex-direction:column;gap:10px}
        .fullscreen-overlay.show{display:flex}
        .fullscreen-overlay textarea{height:100%;background:var(--bg4);color:var(--text4);border:1px solid var(--border3);border-radius:0px;padding:15px;font-size:16px;font-family:monospace;resize:none}
        .fullscreen-close{position:absolute;top:10px;right:20px;background:var(--accent-btn);color:#fff;border:none;padding:10px 16px;border-radius:0px;cursor:pointer;font-size:16px}
        .fullscreen-close:hover{background:var(--accent-btn2)}
        .quick-actions{display:flex;gap:4px;flex-wrap:wrap}
        .q-btn{background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:6px 10px;border-radius:0px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
        .q-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .q-btn.toggled{background-color:var(--accent-btn);color:#fff}
        select{background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:8px;border-radius:0px;font-size:13px;cursor:pointer}
        .easter-egg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:var(--accent-btn);color:#fff;padding:20px 40px;border-radius:0px;font-size:24px;font-weight:bold;z-index:999;text-align:center;box-shadow:0 0 40px var(--shadow);pointer-events:none;transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
        .easter-egg.show{transform:translate(-50%,-50%) scale(1)}
        .easter-egg .heart{display:inline-block;animation:pulse 0.6s ease-in-out infinite alternate}
        @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.3)}}
        input[type="file"]{display:none}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:998;justify-content:center;align-items:center}
        .modal-overlay.show{display:flex}
        .modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:0px;padding:20px;text-align:center;color:var(--text2);font-size:14px;max-width:400px;width:90%;display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow-y:auto}
        .modal-box button{background:var(--btn);color:var(--text2);border:1px solid var(--border);padding:10px;border-radius:0px;cursor:pointer;font-size:14px;width:100%}
        .modal-box button:hover{background:var(--accent-btn);color:#fff}
        .star-text{font-size:14px;color:var(--text2);margin-bottom:4px;line-height:1.5}
        .star-links{display:flex;gap:6px}
        .star-link{flex:1;background:var(--btn);color:var(--text2);border:1px solid var(--border);padding:10px;border-radius:0px;cursor:pointer;font-size:14px;text-decoration:none;text-align:center;transition:all 0.2s}
        .star-link:hover{background:var(--accent-btn);color:#fff}
        .dns-grid,.view-grid{display:flex;flex-direction:column;gap:8px;text-align:left}
        .dns-grid label,.view-grid label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--text2);padding:8px;border-radius:0px;background:var(--btn)}
        .dns-grid label:hover,.view-grid label:hover{background:var(--btn2)}
        .dns-grid input[type="checkbox"],.view-grid input[type="checkbox"]{accent-color:var(--accent-btn);width:18px;height:18px}
        .dns-done-btn{background:var(--accent-btn)!important;color:#fff!important;margin-top:6px}
        .drop-box{background:var(--bg2);border:2px dashed var(--accent-btn);border-radius:0px;padding:40px;text-align:center;color:var(--text2);font-size:16px;cursor:pointer}
        .drop-box.drag-over{border-color:var(--accent);background:var(--btn2)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent-btn);color:#fff;padding:10px 20px;border-radius:0px;font-size:13px;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.3);opacity:0;pointer-events:none}
        .toast.show{animation:toastIn 0.3s forwards,toastOut 0.3s 1.7s forwards}
        @keyframes toastIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
        @keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}
    </style>
</head>
<body>
<div class="easter-egg" id="easterEgg"><span id="easterText"></span> <span class="heart">❤️</span></div>
<div class="modal-overlay" id="dropOverlay" onclick="hideModal('dropOverlay')"><div class="drop-box" id="dropBox" onclick="event.stopPropagation()"><span id="dropText"></span><input type="file" id="dropFileInput" accept="*" onchange="handleFile(this,true)" style="display:none"></div></div>
<div class="modal-overlay" id="exportMenu" onclick="hideModal('exportMenu')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-weight:bold" id="exportTitle"></div><button onclick="exportFile('txt')">📄 TXT</button><button onclick="exportFile('csv')">📊 CSV</button><button onclick="exportFile('json')">📋 JSON</button><button onclick="exportFile('md')">📝 Markdown</button></div></div>
<div class="modal-overlay" id="dnsMenu" onclick="hideModal('dnsMenu')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-weight:bold" id="dnsMenuTitle"></div><div class="dns-grid" id="dnsGrid"></div><button class="dns-done-btn" onclick="hideModal('dnsMenu')" id="dnsDoneBtn"></button></div></div>
<div class="modal-overlay" id="viewMenu" onclick="hideModal('viewMenu')"><div class="modal-box" onclick="event.stopPropagation()"><div style="font-weight:bold" id="viewMenuTitle"></div><div class="view-grid" id="viewGrid"></div><button class="dns-done-btn" onclick="hideModal('viewMenu')" id="viewDoneBtn"></button></div></div>
<div class="modal-overlay" id="starMenu" onclick="hideModal('starMenu')"><div class="modal-box" onclick="event.stopPropagation()"><div class="star-text" id="starText"></div><div class="star-links"><a href="https://github.com/Michi-Mochirellune/dns-resolver-michigan" target="_blank" class="star-link">⭐ GitHub</a><a href="https://t.me/MichiMochirellune" target="_blank" class="star-link">📢 Telegram</a></div></div></div>
<div class="fullscreen-overlay" id="fsInput"><button class="fullscreen-close" onclick="closeFS('fsInput')">✕</button><textarea id="fsInputBox"></textarea></div>
<div class="fullscreen-overlay" id="fsResults"><button class="fullscreen-close" onclick="closeFS('fsResults')">✕</button><textarea id="fsResultsBox" readonly></textarea></div>
<div class="container" id="mainContainer">
    <div class="header">
        <div class="header-left">
            <img class="logo" id="logo" src="https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/logop.png" alt="Dns resolver Michigan" onclick="easterClick()">
            <button class="h-btn star-btn" onclick="showModal('starMenu')" title="Поддержать проект">⭐</button>
        </div>
        <div class="header-buttons">
            <button class="h-btn preset" onclick="addPreset('telegram.org\nreddit.com\nwikipedia.org\nstackoverflow.com\n')" id="presetBtn"></button>
            <button class="h-btn theme-btn" id="themeToggleBtn" onclick="cycleTheme()"></button>
            <button class="h-btn lang" id="langToggleBtn" onclick="toggleLanguage()"></button>
            <button class="h-btn" id="settingsToggleBtn" onclick="toggleSettings()"><span id="settingsBtnText"></span></button>
        </div>
    </div>
    <div class="settings-box" id="settingsBox">
        <div class="s-label" id="dnsLabel"></div>
        <button class="dns-select-btn" onclick="showDNSMenu()" id="dnsSelectBtn"></button>
        <button class="view-select-btn" onclick="showViewMenu()" id="viewSelectBtn">👁️ Вид результатов</button>
        <div class="settings-row">
            <div class="settings-item">
                <div class="settings-label" id="typeLabel">📝 Тип записи</div>
                <select id="recordType" onchange="setRecordType(this.value)">
                    <option value="A">🌐 A (IPv4)</option>
                    <option value="AAAA">🌍 AAAA (IPv6)</option>
                    <option value="MX">📧 MX (<span id="mxLabel"></span>)</option>
                    <option value="NS">🗄️ NS (<span id="nsLabel"></span>)</option>
                    <option value="SOA">📋 SOA (<span id="soaLabel"></span>)</option>
                    <option value="TXT">📝 TXT (<span id="txtLabel"></span>)</option>
                </select>
            </div>
            <div class="settings-item">
                <div class="settings-label" id="timeoutLabel">⏰ Таймаут</div>
                <select id="timeoutSelect" onchange="setTimeoutVal(parseInt(this.value))">
                    <option value="5">5 сек</option>
                    <option value="10">10 сек</option>
                    <option value="15">15 сек</option>
                </select>
            </div>
            <div class="settings-item">
                <div class="settings-label" id="delayLabel">🐌 Задержка</div>
                <select id="delaySelect" onchange="setDelay(parseInt(this.value))">
                    <option value="0">Без задержки</option>
                    <option value="500">0.5 сек</option>
                    <option value="1000">1 сек</option>
                </select>
            </div>
        </div>
        <div class="s-label" id="formatLabel">🎨 Формат вывода</div>
        <div class="btn-group"><button class="tgl-btn" id="formatBtn" onclick="toggleFormat()">🔢 Формат: Only IP</button></div>
    </div>
    <div class="quick-actions">
        <button class="q-btn" onclick="dedupDomains()" id="dedupBtn"></button>
        <button class="q-btn" onclick="showModal('dropOverlay')" id="uploadBtn"></button>
    </div>
    <input type="file" id="fileInput" accept="*" onchange="handleFile(this,false)">
    <div class="search-row"><input type="text" class="search-input" id="inputSearch" placeholder="🔍 Поиск по доменам..." oninput="filterInputDomains()"></div>
    <div class="input-row"><textarea id="inputDomains" placeholder="..." oninput="updateLineCounter()"></textarea><div class="side-btns"><button class="side-btn" onclick="openFS('fsInput','inputDomains','fsInputBox')" title="Раскрыть">⛶</button><button class="side-btn" onclick="copyTextarea('inputDomains')" title="Копировать">📋</button><button class="side-btn danger" onclick="clearInputOnly()" title="Очистить">🗑️</button></div></div>
    <div class="line-counter" id="lineCounter"></div>
    <button class="main-btn start" id="startBtn" onclick="startResolving()"></button>
    <button class="main-btn stop" id="stopBtn" onclick="stopResolving()"></button>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="dns-indicator" id="dnsIndicator"></div>
    <div class="stats" id="stats"></div>
    <div class="time-info" id="timeInfo"></div>
    <div class="results-container" id="resultsContainer">
        <div class="search-row"><input type="text" class="search-input" id="resultsSearch" placeholder="🔍 Поиск по результатам..." oninput="applyAllFilters()"></div>
        <div class="results-header">
            <div class="results-actions">
                <button class="a-btn" onclick="cycleFilter()" id="filterBtn"></button>
                <select class="a-btn" id="providerFilter" onchange="applyAllFilters()" style="padding:7px 12px">
                    <option value="all">🏢 Все провайдеры</option>

function updateStatsDisplay(){if(!currentResults.length){document.getElementById('stats').innerText='';return}const found=currentResults.filter(r=>!r.error).length;const errors=currentResults.length-found;const ips=new Set();for(let r of currentResults){if(!r.error&&r.ip)ips.add(r.ip)}document.getElementById('stats').innerText=t('stats',found,errors,currentResults.length,ips.size)}

function filterInputDomains(){const query=document.getElementById('inputSearch').value.toLowerCase();const ta=document.getElementById('inputDomains');if(!allInputDomains&&ta.value)allInputDomains=ta.value;const source=allInputDomains||ta.value;const lines=source.split('\n');if(!query.trim()){ta.value=source;updateLineCounter();return}const filtered=lines.filter(l=>l.toLowerCase().includes(query));ta.value=filtered.join('\n');updateLineCounter()}

if(query.trim()){filtered=filtered.filter(r=>r.domain.toLowerCase().includes(query)||(r.ip||'').toLowerCase().includes(query)||(r.server||'').toLowerCase().includes(query))}
displayResults(filtered);updateStatsDisplay()}
function displayResults(results){const rb=document.getElementById('resultsBox');let lines=[];for(let i=0;i<results.length;i++){let r=results[i];let line;if(r.error){line=outputFormat==='hosts'?`${t('errorHosts')} ${r.domain}`:t('errorHosts')+' '+r.domain}else{let extras='';if(showTTL&&r.ttl)extras+=' | TTL: '+r.ttl+'s';if(showSpeed&&r.responseTime)extras+=' | ⚡ '+r.responseTime+' ms';let prefix='';if(showDNSNames&&r.server&&allDNSServers[r.server]){prefix=allDNSServers[r.server].short+': '}line=outputFormat==='hosts'?`${prefix}${r.ip} ${r.domain}${extras}`:prefix+r.ip+extras}lines.push(line);if(showSep&&i<results.length-1)lines.push('')}rb.value=lines.join('\n');updateStatsDisplay()}

function exportFile(format){if(!currentResults.length){toast(t('emptyToast'));return}let content='',mime='text/plain',ext='txt';if(format==='csv'){content='Domain,IP,Status';if(showTTL)content+=',TTL';content+='\n';for(let r of currentResults){content+=`${r.domain},${r.ip||''},${r.error?'Error':'OK'}`;if(showTTL)content+=`,${r.ttl||''}`;content+='\n'}mime='text/csv';ext='csv'}else if(format==='json'){content=JSON.stringify(currentResults.map(r=>({domain:r.domain,ip:r.ip||null,error:r.error,ttl:showTTL?r.ttl||null:undefined,dnssec:r.dnssec||false,responseTime:r.responseTime||null,server:r.server||null})),null,2);mime='application/json';ext='json'}else if(format==='md'){content='| Domain | IP | Status |';if(showTTL)content+=' TTL |';content+='\n|:---|:---|:---|';if(showTTL)content+=':---|';content+='\n';for(let r of currentResults){content+=`| ${r.domain} | ${r.ip||'-'} | ${r.error?'❌':'✅'} |`;if(showTTL)content+=` ${r.ttl||''} |`;content+='\n'}mime='text/markdown';ext='md'}else{content=document.getElementById('resultsBox').value||'';if(!content.trim()){for(let r of currentResults){if(r.error){content+=outputFormat==='hosts'?`${t('errorHosts')} ${r.domain}\n`:t('errorHosts')+' '+r.domain+'\n'}else{let extras='';if(showTTL&&r.ttl)extras+=' | TTL: '+r.ttl+'s';if(showSpeed&&r.responseTime)extras+=' | ⚡ '+r.responseTime+' ms';content+=outputFormat==='hosts'?`${r.ip} ${r.domain}${extras}\n`:r.ip+extras+'\n'}}}}const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`dns-results.${ext}`;a.click();URL.revokeObjectURL(url);toast(t('exported'))}

async function resolveSingle(domain,serverKey,type){
const startTime=Date.now();
try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);let apiUrl=allDNSServers[serverKey]?allDNSServers[serverKey].url:'https://cloudflare-dns.com/dns-query';let r=await fetch(`${apiUrl}?name=${encodeURIComponent(domain)}&type=${type}`,{headers:{'Accept':'application/dns-json'},signal:controller.signal});clearTimeout(timer);let d=await r.json();let result=null,ttl=null,dnssec=!!d.AD;if(d.Answer&&d.Answer.length>0){
if(type==='MX'){let mx=d.Answer.filter(r=>r.type===15).sort((a,b)=>a.preference-b.preference);if(mx.length>0){result=mx.map(r=>r.data).join(', ');ttl=mx[0].TTL}}
else if(type==='NS'){let ns=d.Answer.filter(r=>r.type===2);if(ns.length>0){result=ns.map(r=>r.data).join(', ');ttl=ns[0].TTL}}
else if(type==='TXT'){let txt=d.Answer.filter(r=>r.type===16);if(txt.length>0){result=txt.map(r=>r.data).join(' | ');ttl=txt[0].TTL}}
else if(type==='SOA'){let soa=d.Answer.find(r=>r.type===6);if(soa){result=soa.data;ttl=soa.TTL}}
else{let rec=d.Answer.find(r=>r.type===recordTypes[type]);if(rec){result=rec.data;ttl=rec.TTL}}}
return{result,ttl,dnssec,size:JSON.stringify(d).length,responseTime:Date.now()-startTime}}catch(e){return{error:true,responseTime:Date.now()-startTime}}}
async function startResolving(){
const it=document.getElementById('inputDomains').value,rb=document.getElementById('resultsBox'),rc=document.getElementById('resultsContainer'),stats=document.getElementById('stats'),timeInfo=document.getElementById('timeInfo'),dnsIndicator=document.getElementById('dnsIndicator'),startBtn=document.getElementById('startBtn'),stopBtn=document.getElementById('stopBtn'),progressBar=document.getElementById('progressBar'),progressFill=document.getElementById('progressFill');
if(activeServers.length===0){document.getElementById('inputDomains').value='';allInputDomains='';updateLineCounter();rc.style.display='flex';stats.innerText='';timeInfo.innerText='';dnsIndicator.innerText='';rb.value=t('noServers');updateStatsDisplay();return}
let inputText=it.replace(/https?:\/\//g,'').replace(/\/.*/g,'');const lines=inputText.split('\n');let domains=lines.map(l=>l.trim()).filter(l=>l.length>0);
if(domains.length===0){rc.style.display='none';rb.value=t('empty');toast(t('noDomainsToast'));return}
allInputDomains=it;rc.style.display='flex';stats.innerText='';timeInfo.innerText='';dnsIndicator.innerText='';rb.value='';startBtn.style.display='none';stopBtn.style.display='inline-block';stopBtn.textContent=t('stopBtn');progressBar.style.display='block';progressFill.style.width='0%';stopBtn.disabled=false;currentResults=[];resolveStartTime=Date.now();
const names=activeServers.map(k=>allDNSServers[k]?allDNSServers[k].name:k).join(', ');dnsIndicator.innerText=t('dnsIndicator',names);toast(t('started'));
let found=0,errors=0,totalSize=0;abortController=new AbortController();
for(let i=0;i<domains.length;i++){if(abortController.signal.aborted)break;let domain=domains[i];
for(let s of activeServers){let res=await resolveSingle(domain,s,recordType);
if(res&&res.result){found++;totalSize+=res.size;currentResults.push({domain,ip:res.result,error:false,ttl:res.ttl||null,dnssec:res.dnssec,size:res.size,server:s,responseTime:res.responseTime||null})}else{errors++;currentResults.push({domain,ip:null,error:true,size:0,server:s,responseTime:res.responseTime||null})}}
stats.innerText=t('stats',found,errors,i+1,new Set(currentResults.filter(r=>!r.error&&r.ip).map(r=>r.ip)).size);progressFill.style.width=((i+1)/domains.length*100)+'%';
if(delay>0&&i<domains.length-1&&!abortController.signal.aborted)await new Promise(r=>setTimeout(r,delay))}
updateProviderFilter();applyAllFilters();
const elapsed=((Date.now()-resolveStartTime)/1000).toFixed(1),sizeKB=(totalSize/1024).toFixed(1);timeInfo.innerText=t('timeInfo',elapsed,sizeKB);abortController=null;stopResolving()}
document.getElementById('dropBox').addEventListener('click',()=>document.getElementById('dropFileInput').click());
document.getElementById('dropBox').addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.classList.add('drag-over')});
document.getElementById('dropBox').addEventListener('dragleave',e=>{e.currentTarget.classList.remove('drag-over')});
document.getElementById('dropBox').addEventListener('drop',e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');const file=e.dataTransfer.files[0];if(file){const dt=new DataTransfer();dt.items.add(file);document.getElementById('dropFileInput').files=dt.files;handleFile(document.getElementById('dropFileInput'),true)}});
try{const savedLang=localStorage.getItem('dnsresolver_lang');if(savedLang==='ru'||savedLang==='en')currentLanguage=savedLang;const savedTheme=localStorage.getItem('dnsresolver_theme');if(savedTheme==='system'||savedTheme==='light'||savedTheme==='dark'||savedTheme==='xp')themeMode=savedTheme}catch(e){}
applyTheme();updateAllTexts();
