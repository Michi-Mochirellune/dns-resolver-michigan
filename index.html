<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dns resolver Michigan</title>
    <style>
        :root{
            --bg:#0b0712;--bg2:#160f24;--bg3:#1f142e;--bg4:#130c1f;--text:#e6dbff;--text2:#bfa6ff;--text3:#9980b3;--text4:#d4c7e8;--border:#321f4d;--border2:#442a66;--border3:#281840;--btn:#251a3a;--btn2:#402666;--btn3:#2d1a4a;--accent:#d4a8ff;--accent2:#e0c4ff;--accent-btn:#782ec7;--accent-btn2:#8c3be0;--green:#1a6b3c;--green2:#2ecc71;--input:#1f142e;--input-text:#e6e1ff;--placeholder:#665980;--dev-bg:#1a1130;--dev-border:#3d2760;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bg.jpg');--overlay:rgba(11,7,18,0.6);--preset-bg:#1a5c3a;--preset-text:#c2ffcc;--preset-hover:#22734a;--shadow:rgba(212,168,255,0.3);--clear-hover:#c0392b;--toggle-active-text:#fff;--hover-text:#fff;--active-border:#9445ff
        }
        .light{
            --bg:#fefefe;--bg2:#f5f5f5;--bg3:#eee;--bg4:#f5f5f5;--text:#333;--text2:#555;--text3:#939394;--text4:#444;--border:#ddd;--border2:#ccc;--border3:#ddd;--btn:#f0f0f0;--btn2:#e8e8e8;--btn3:#eee;--accent:#666;--accent2:#777;--accent-btn:#888;--accent-btn2:#999;--green:#1a6b3c;--green2:#2ecc71;--input:#f5f5f5;--input-text:#333;--placeholder:#aaa;--dev-bg:#f0f0f0;--dev-border:#ddd;--bg-img:url('https://raw.githubusercontent.com/Michi-Mochirellune/dns-resolver-michigan/main/bgw.jpg');--overlay:rgba(254,254,254,0.7);--preset-bg:#1a6b3c;--preset-text:#fff;--preset-hover:#1e7a45;--shadow:rgba(0,0,0,0.1);--clear-hover:#c0392b;--toggle-active-text:#333;--hover-text:#333;--active-border:#aaa
        }
        body{
            background-color:var(--bg);
            background-image:var(--bg-img);
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            color:var(--text);
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            margin:0;
            padding:20px;
            display:flex;
            flex-direction:column;
            align-items:center;
            min-height:100vh;
            box-sizing:border-box;
            position:relative;
            transition:background-color 0.3s,color 0.3s;
        }
        body::before{
            content:'';
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background-color:var(--overlay);
            z-index:0;
            transition:background-color 0.3s;
        }
        .container{width:100%;max-width:500px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
        .header{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:5px;flex-wrap:wrap;gap:8px}
        h1{color:var(--accent);font-size:22px;margin:0;font-weight:bold;text-shadow:0 0 10px var(--shadow);cursor:pointer;user-select:none;transition:0.2s}
        h1:hover{text-shadow:0 0 20px var(--shadow)}
        .header-buttons{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .settings-toggle,.lang-toggle,.preset-btn,.theme-toggle{background-color:var(--btn2);color:var(--text2);border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s;white-space:nowrap}
        .settings-toggle:hover,.lang-toggle:hover,.preset-btn:hover,.theme-toggle:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .lang-toggle{background-color:var(--btn3)}
        .theme-toggle{background-color:var(--btn2);color:var(--text2)}
        .preset-btn{background-color:var(--preset-bg);color:var(--preset-text)}
        .preset-btn:hover{background-color:var(--preset-hover);color:#fff}
        .settings-box{background-color:var(--bg2);border-radius:8px;padding:15px;display:none;flex-direction:column;gap:12px;border:1px solid var(--border);transition:background-color 0.3s}
        .settings-label{font-size:14px;color:var(--text3)}
        .btn-group{display:flex;gap:8px;flex-wrap:wrap}
        .toggle-btn{flex:1;min-width:70px;background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:10px 8px;font-size:13px;border-radius:6px;cursor:pointer;transition:0.2s;text-align:center}
        .toggle-btn.active{background-color:var(--accent-btn);color:var(--toggle-active-text);border-color:var(--active-border);box-shadow:0 0 8px var(--shadow)}
        textarea{width:100%;height:140px;background-color:var(--input);color:var(--input-text);border:1px solid var(--border2);border-radius:8px;padding:12px;font-size:16px;box-sizing:border-box;resize:vertical;outline:none;transition:background-color 0.3s,color 0.3s}
        textarea::placeholder{color:var(--placeholder)}
        textarea:focus{border-color:var(--accent-btn)}
        .input-row{display:flex;gap:8px}
        .clear-btn{background-color:var(--btn2);color:var(--text2);border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s;white-space:nowrap}
        .clear-btn:hover{background-color:var(--clear-hover);color:#fff}
        .start-btn{background-color:var(--accent-btn);color:#fff;border:none;border-radius:8px;padding:14px;font-size:18px;font-weight:bold;cursor:pointer;transition:0.2s;box-shadow:0 0 15px var(--shadow)}
        .start-btn:hover{background-color:var(--accent-btn2)}
        .start-btn:disabled{opacity:0.5;cursor:not-allowed}
        .stats{color:var(--text3);font-size:13px;text-align:center;min-height:18px}
        .results-container{display:none;flex-direction:column;gap:8px}
        .results-header{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px}
        .export-btn{background-color:var(--btn3);color:var(--text2);border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:0.2s}
        .export-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .copy-btn{background-color:var(--btn2);color:var(--text2);border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s;display:flex;align-items:center;gap:6px}
        .copy-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .copy-btn.copied{background-color:var(--green);border-color:var(--green2);color:#fff}
        .copy-btn svg{width:16px;height:16px;fill:currentColor}
        .results-textarea{width:100%;height:180px;background-color:var(--bg4);border:1px solid var(--border3);color:var(--text4);border-radius:8px;padding:12px;font-size:16px;box-sizing:border-box;resize:vertical;outline:none;font-family:monospace;transition:background-color 0.3s,color 0.3s}
        .results-textarea:focus{border-color:var(--accent-btn)}
        .loading-spinner{display:none;width:20px;height:20px;border:3px solid var(--btn2);border-top:3px solid var(--accent-btn);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .quick-actions{display:flex;gap:6px;flex-wrap:wrap}
        .quick-btn{background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;transition:0.2s}
        .quick-btn:hover{background-color:var(--accent-btn);color:var(--hover-text)}
        .developer-links{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px;padding-top:15px;border-top:1px solid var(--border3);width:100%;flex-wrap:wrap}
        .dev-link{display:flex;align-items:center;gap:8px;color:var(--text2);text-decoration:none;font-size:15px;transition:0.2s;padding:6px 12px;border-radius:20px;background-color:var(--dev-bg);border:1px solid var(--dev-border)}
        .dev-link:hover{background-color:var(--btn3);border-color:var(--accent-btn);color:var(--accent-btn);box-shadow:0 0 10px var(--shadow)}
        .dev-link svg{width:18px;height:18px;fill:currentColor}
        .dev-label{color:var(--text3);font-size:13px;margin-right:4px}
        select{background-color:var(--btn);color:var(--text2);border:1px solid var(--border);padding:8px;border-radius:6px;font-size:13px;cursor:pointer}
        /* Пасхалка */
        .easter-egg{
            position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
            background:var(--accent-btn);color:#fff;padding:20px 40px;border-radius:16px;
            font-size:24px;font-weight:bold;z-index:999;text-align:center;
            box-shadow:0 0 40px var(--shadow);pointer-events:none;
            transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        .easter-egg.show{transform:translate(-50%,-50%) scale(1)}
        .easter-egg .heart{display:inline-block;animation:pulse 0.6s ease-in-out infinite alternate}
        @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.3)}}
    </style>
</head>
<body>
<div class="easter-egg" id="easterEgg"><span id="easterText">Спасибо за использование</span> <span class="heart">❤️</span></div>
<div class="container">
    <div class="header">
        <h1 id="title" onclick="easterClick()">Dns resolver Michigan</h1>
        <div class="header-buttons">
            <button class="preset-btn" onclick="addPreset('telegram.org\nreddit.com\nwikipedia.org\nstackoverflow.com\n')" id="presetBtn">Тест сайтов</button>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌓</button>
            <button class="lang-toggle" id="langToggleBtn" onclick="toggleLanguage()">🇷🇺 RU</button>
            <button class="settings-toggle" id="settingsToggleBtn" onclick="toggleSettings()">⚙ <span id="settingsBtnText">Настройки</span></button>
        </div>
    </div>
    <div class="settings-box" id="settingsBox">
        <div class="settings-label" id="dnsLabel">Выбор DNS сервера:</div>
        <div class="btn-group">
            <button class="toggle-btn active" id="dnsCloudflare" onclick="setDns('cloudflare')">Cloudflare</button>
            <button class="toggle-btn" id="dnsGoogle" onclick="setDns('google')">Google</button>
        </div>
        <div class="settings-label" id="typeLabel">Тип записи:</div>
        <div class="btn-group">
            <select id="recordType" onchange="setRecordType(this.value)">
                <option value="A">A (IPv4)</option>
                <option value="AAAA">AAAA (IPv6)</option>
                <option value="MX">MX (Почта)</option>
                <option value="NS">NS (DNS-серверы)</option>
                <option value="TXT">TXT (Текст)</option>
            </select>
        </div>
        <div class="settings-label" id="timeoutLabel">Таймаут:</div>
        <div class="btn-group">
            <button class="toggle-btn active" id="to5" onclick="setTimeoutVal(5)">5 сек</button>
            <button class="toggle-btn" id="to10" onclick="setTimeoutVal(10)">10 сек</button>
            <button class="toggle-btn" id="to15" onclick="setTimeoutVal(15)">15 сек</button>
        </div>
        <div class="settings-label" id="delayLabel">Задержка между запросами:</div>
        <div class="btn-group">
            <button class="toggle-btn active" id="del0" onclick="setDelay(0)">Без задержки</button>
            <button class="toggle-btn" id="del500" onclick="setDelay(500)">0.5 сек</button>
            <button class="toggle-btn" id="del1000" onclick="setDelay(1000)">1 сек</button>
        </div>
        <div class="btn-group">
            <button class="toggle-btn" id="formatBtn" onclick="toggleFormat()">Формат: Only IP</button>
        </div>
    </div>
    <div class="quick-actions">
        <button class="quick-btn" onclick="dedupDomains()" id="dedupBtn">📋 Убрать дубли</button>
    </div>
    <div class="input-row">
        <textarea id="inputDomains" placeholder="Вставь список доменов сюда..."></textarea>
        <button class="clear-btn" onclick="clearAll()" id="clearBtn">✕</button>
    </div>
    <button class="start-btn" id="startBtn" onclick="startResolving()">Узнать IP адреса</button>
    <div class="loading-spinner" id="spinner"></div>
    <div class="stats" id="stats"></div>
    <div class="results-container" id="resultsContainer">
        <div class="results-header">
            <button class="export-btn" onclick="exportTXT()" id="exportBtn">📥 Скачать .txt</button>
            <button class="copy-btn" id="copyBtn" onclick="copyResults()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                <span id="copyBtnText">Копировать</span>
            </button>
        </div>
        <textarea id="resultsBox" class="results-textarea" readonly placeholder="Результаты появятся здесь..."></textarea>
    </div>
    <div class="developer-links">
        <span class="dev-label" id="devLabel">Разработчик:</span>
        <a href="https://t.me/MichiMochirellune" target="_blank" class="dev-link" title="Telegram">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.441-.752-.244-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.015 3.333-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.145.118.185.276.204.388.02.111.022.354.012.444z"/></svg>
            Telegram
        </a>
        <a href="https://github.com/Michi-Mochirellune" target="_blank" class="dev-link" title="GitHub">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
            GitHub
        </a>
    </div>
</div>
<script>
let dnsProvider='cloudflare',outputFormat='onlyip',currentLanguage='ru',recordType='A',timeout=5000,delay=0,darkTheme=true,easterClicks=0;
const dnsApiUrls={cloudflare:'https://cloudflare-dns.com/dns-query',google:'https://dns.google/resolve'};
const dnsButtonIds={cloudflare:'dnsCloudflare',google:'dnsGoogle'};
const timeoutIds={5:'to5',10:'to10',15:'to15'};
const delayIds={0:'del0',500:'del500',1000:'del1000'};
const translations={ru:{settings:'Настройки',closeSettings:'✕ Закрыть',dnsLabel:'Выбор DNS сервера:',typeLabel:'Тип записи:',timeoutLabel:'Таймаут:',delayLabel:'Задержка между запросами:',formatBtn:['Формат: Classic','[✔] Формат: Hosts','[IP] Формат: Only IP'],inputPlaceholder:'Вставь список доменов сюда...',startBtn:'Узнать IP адреса',resultsPlaceholder:'Результаты появятся здесь...',resolving:'Идет проверка...\n',empty:'Список пуст.',error:'[Ошибка/Не найден]',errorHosts:'# [Ошибка]',copyBtn:'Копировать',copyBtnDone:'✓ Скопировано!',exportBtn:'📥 Скачать .txt',clearBtn:'✕',presetBtn:'Тест сайтов',dedupBtn:'📋 Убрать дубли',devLabel:'Разработчик:',easter:'Спасибо за использование',stats:(found,errors,total)=>`Найдено: ${found} / Ошибок: ${errors} / Всего: ${total}`},en:{settings:'Settings',closeSettings:'✕ Close',dnsLabel:'Select DNS server:',typeLabel:'Record type:',timeoutLabel:'Timeout:',delayLabel:'Delay between requests:',formatBtn:['Format: Classic','[✔] Format: Hosts','[IP] Format: Only IP'],inputPlaceholder:'Paste domain list here...',startBtn:'Resolve IP addresses',resultsPlaceholder:'Results will appear here...',resolving:'Resolving...\n',empty:'List is empty.',error:'[Error/Not found]',errorHosts:'# [Error]',copyBtn:'Copy',copyBtnDone:'✓ Copied!',exportBtn:'📥 Download .txt',clearBtn:'✕',presetBtn:'Test sites',dedupBtn:'📋 Remove duplicates',devLabel:'Developer:',easter:'Thank you for using',stats:(found,errors,total)=>`Found: ${found} / Errors: ${errors} / Total: ${total}`}};
function t(key,...args){let str=translations[currentLanguage][key];if(typeof str==='function')return str(...args);return str}
function updateUILanguage(){
document.getElementById('inputDomains').placeholder=t('inputPlaceholder');
document.getElementById('resultsBox').placeholder=t('resultsPlaceholder');
document.getElementById('startBtn').innerText=t('startBtn');
document.getElementById('dnsLabel').innerText=t('dnsLabel');
document.getElementById('typeLabel').innerText=t('typeLabel');
document.getElementById('timeoutLabel').innerText=t('timeoutLabel');
document.getElementById('delayLabel').innerText=t('delayLabel');
document.getElementById('exportBtn').innerText=t('exportBtn');
document.getElementById('clearBtn').innerText=t('clearBtn');
document.getElementById('presetBtn').innerText=t('presetBtn');
document.getElementById('dedupBtn').innerText=t('dedupBtn');
document.getElementById('devLabel').innerText=t('devLabel');
const ct=document.getElementById('copyBtnText'),cb=document.getElementById('copyBtn');
if(!cb.classList.contains('copied'))ct.innerText=t('copyBtn');
updateFormatButtonText();
document.getElementById('langToggleBtn').innerText=currentLanguage==='ru'?'🇷🇺 RU':'🇬🇧 EN';
updateSettingsButtonText()}
function updateSettingsButtonText(){
const sb=document.getElementById('settingsBox'),stb=document.getElementById('settingsToggleBtn'),sbt=document.getElementById('settingsBtnText');
if(sb.style.display==='flex'){sbt.innerText=t('closeSettings');stb.style.backgroundColor=''}
else{sbt.innerText=t('settings');stb.style.backgroundColor=''}}
function updateFormatButtonText(){
const b=document.getElementById('formatBtn'),fl=t('formatBtn');
if(outputFormat==='classic'){b.innerText=fl[0];b.classList.remove('active')}
else if(outputFormat==='hosts'){b.innerText=fl[1];b.classList.add('active')}
else{b.innerText=fl[2];b.classList.add('active')}}
function toggleLanguage(){currentLanguage=currentLanguage==='ru'?'en':'ru';updateUILanguage()}
function toggleTheme(){
darkTheme=!darkTheme;
document.body.classList.toggle('light',!darkTheme);
document.getElementById('themeToggleBtn').innerText=darkTheme?'🌓':'☀️'}
function toggleSettings(){
const b=document.getElementById('settingsBox');
b.style.display=b.style.display==='flex'?'none':'flex';
updateSettingsButtonText()}
function setDns(p){
dnsProvider=p;
Object.values(dnsButtonIds).forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('active')});
const ab=document.getElementById(dnsButtonIds[p]);if(ab)ab.classList.add('active')}
function setRecordType(t){recordType=t}
function setTimeoutVal(s){
timeout=s*1000;
Object.values(timeoutIds).forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('active')});
const ab=document.getElementById(timeoutIds[s]);if(ab)ab.classList.add('active')}
function setDelay(d){
delay=d;
Object.values(delayIds).forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('active')});
const ab=document.getElementById(delayIds[d]);if(ab)ab.classList.add('active')}
function toggleFormat(){
if(outputFormat==='classic')outputFormat='hosts';
else if(outputFormat==='hosts')outputFormat='onlyip';
else outputFormat='classic';
updateFormatButtonText()}
function addPreset(text){document.getElementById('inputDomains').value=text}
function dedupDomains(){
const ta=document.getElementById('inputDomains');
const lines=ta.value.split('\n').map(l=>l.trim().toLowerCase()).filter(l=>l.length>0);
ta.value=[...new Set(lines)].join('\n')}
function clearAll(){
document.getElementById('inputDomains').value='';
document.getElementById('resultsBox').value='';
document.getElementById('resultsContainer').style.display='none';
document.getElementById('stats').innerText=''}
function easterClick(){
easterClicks++;
if(easterClicks>=3){
const egg=document.getElementById('easterEgg');
const text=document.getElementById('easterText');
text.innerText=t('easter');
egg.classList.add('show');
setTimeout(()=>{egg.classList.remove('show')},2500);
easterClicks=0}}
function copyResults(){
const rb=document.getElementById('resultsBox'),cb=document.getElementById('copyBtn'),ct=document.getElementById('copyBtnText');
rb.select();rb.setSelectionRange(0,99999);
try{navigator.clipboard.writeText(rb.value).then(()=>{cb.classList.add('copied');ct.innerText=t('copyBtnDone');setTimeout(()=>{cb.classList.remove('copied');ct.innerText=t('copyBtn')},2000)}).catch(()=>{document.execCommand('copy');cb.classList.add('copied');ct.innerText=t('copyBtnDone');setTimeout(()=>{cb.classList.remove('copied');ct.innerText=t('copyBtn')},2000)})}
catch(e){document.execCommand('copy');cb.classList.add('copied');ct.innerText=t('copyBtnDone');setTimeout(()=>{cb.classList.remove('copied');ct.innerText=t('copyBtn')},2000)}}
function exportTXT(){
const rb=document.getElementById('resultsBox');
if(!rb.value.trim())return;
const blob=new Blob([rb.value],{type:'text/plain'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='dns-results.txt';a.click();
URL.revokeObjectURL(url)}
async function startResolving(){
const it=document.getElementById('inputDomains').value,rb=document.getElementById('resultsBox'),rc=document.getElementById('resultsContainer'),cb=document.getElementById('copyBtn'),ct=document.getElementById('copyBtnText'),spinner=document.getElementById('spinner'),stats=document.getElementById('stats'),startBtn=document.getElementById('startBtn');
rc.style.display='none';stats.innerText='';cb.classList.remove('copied');ct.innerText=t('copyBtn');rb.value='';spinner.style.display='block';startBtn.disabled=true;
const lines=it.split('\n');let domains=lines.map(l=>l.trim()).filter(l=>l.length>0);
if(domains.length===0){spinner.style.display='none';startBtn.disabled=false;rb.value=t('empty');rc.style.display='flex';return}
let output=[],apiUrl=dnsApiUrls[dnsProvider],found=0,errors=0;
for(let i=0;i<domains.length;i++){
let domain=domains[i];
try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
let r=await fetch(`${apiUrl}?name=${encodeURIComponent(domain)}&type=${recordType}`,{headers:{'Accept':'application/dns-json'},signal:controller.signal});
clearTimeout(timer);let d=await r.json();let result=null;
if(d.Answer&&d.Answer.length>0){if(recordType==='MX'){let mx=d.Answer.filter(r=>r.type===15).sort((a,b)=>a.preference-b.preference);if(mx.length>0)result=mx.map(r=>r.data).join(', ')}
else if(recordType==='NS'){let ns=d.Answer.filter(r=>r.type===2);if(ns.length>0)result=ns.map(r=>r.data).join(', ')}
else if(recordType==='TXT'){let txt=d.Answer.filter(r=>r.type===16);if(txt.length>0)result=txt.map(r=>r.data).join(' | ')}
else{let rec=d.Answer.find(r=>r.type===(recordType==='AAAA'?28:1));if(rec)result=rec.data}}
if(result){found++;
if(outputFormat==='hosts')output.push(`${result} ${domain}`);
else if(outputFormat==='onlyip')output.push(result);
else output.push(`[ + ] ${domain}  ->  ${result}`)}
else throw new Error()}
catch(e){errors++;
if(outputFormat==='hosts')output.push(`${t('errorHosts')} ${domain}`);
else if(outputFormat==='onlyip')output.push('-');
else output.push(`[ - ] ${domain}  ->  ${t('error')}`)}
rb.value=output.join('\n');
stats.innerText=t('stats',found,errors,i+1);
if(delay>0&&i<domains.length-1)await new Promise(r=>setTimeout(r,delay))}
spinner.style.display='none';startBtn.disabled=false;rc.style.display='flex'}
updateUILanguage();
</script>
</body>
</html>
